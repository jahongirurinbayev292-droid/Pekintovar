<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Pekin Tavor - Yorqin Katalog</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%); /* Yorqin pushti-to'q sariq gradient */
            min-height: 100vh;
            color: #333;
        }
        .header { text-align: center; padding: 40px 20px; color: white; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }
        
        .nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav button {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #f5576c;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .nav button:hover { transform: scale(1.1); background: #333; color: white; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-info { padding: 20px; }
        .price { font-size: 1.5rem; color: #ff4757; font-weight: bold; margin: 10px 0; }
        .cat-badge { background: #eee; padding: 5px 12px; border-radius: 15px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ PEKIN TAVOR ✨</h1>
        <p>Sifatli va hamyonbop kiyimlar olami</p>
    </div>

    <div class="nav">
        <button onclick="load('Hammasi')">Barchasi</button>
        <button onclick="load('Erkaklar')">Erkaklar</button>
        <button onclick="load('Ayollar')">Ayollar</button>
        <button onclick="load('Bolalar')">Bolalar</button>
    </div>

    <div class="grid" id="products"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function load(category) {
            const container = document.getElementById('products');
            container.innerHTML = "<h2 style='color:white'>Yuklanmoqda...</h2>";
            
            let query = db.ref('products');
            if (category !== 'Hammasi') {
                query = query.orderByChild('category').equalTo(category);
            }

            query.on('value', (snapshot) => {
                container.innerHTML = "";
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = "<h3 style='color:white'>Hozircha mahsulot yo'q</h3>";
                    return;
                }

                Object.values(data).reverse().forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <img src="${item.images[0]}" alt="Kiyim">
                            <div class="card-info">
                                <span class="cat-badge">${item.category}</span>
                                <h3>${item.name}</h3>
                                <div class="price">${item.price.toLocaleString()} so'm</div>
                                <p>${item.desc || ''}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }
        load('Hammasi'); // Boshida hammasini chiqarish
    </script>
</body>
</html>
