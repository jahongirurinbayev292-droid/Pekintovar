<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>NEON MARKET</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0a0a2a, #1a0033);
            color: white;
            min-height: 100vh;
        }
        .navbar {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 24px;
            color: #bf40ff;
            font-weight: bold;
        }
        .nav-btn {
            background: rgba(191,64,255,0.2);
            border: 1px solid #bf40ff;
            color: #bf40ff;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        .nav-btn:hover {
            background: #bf40ff;
            color: white;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(191,64,255,0.3);
        }
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
        }
        .product-name {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .product-price {
            color: #bf40ff;
            font-size: 20px;
            font-weight: bold;
        }
        .card-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-wishlist {
            background: rgba(255,64,64,0.2);
            color: #ff4040;
            border: 1px solid #ff4040;
        }
        .btn-cart {
            background: rgba(191,64,255,0.2);
            color: #bf40ff;
            border: 1px solid #bf40ff;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a0033;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            padding: 20px;
            border: 2px solid #bf40ff;
        }
        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #bf40ff;
        }
        .sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100%;
            background: rgba(0,0,0,0.95);
            transition: 0.3s;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #bf40ff;
            z-index: 1001;
        }
        .sidebar.active {
            right: 0;
        }
        .cart-item, .wishlist-item {
            background: rgba(191,64,255,0.1);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }
        .checkout-btn {
            background: #bf40ff;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #bf40ff;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">✨ NEON MARKET ✨</div>
    <div>
        <button class="nav-btn" onclick="openWishlist()">⭐ Istaklar (<span id="wishlistCount">0</span>)</button>
        <button class="nav-btn" onclick="openCart()">🛒 Savatcha (<span id="cartCount">0</span>)</button>
        <button class="nav-btn" onclick="openSettings()">⚙️ Sozlamalar</button>
    </div>
</div>

<div class="products-grid" id="productsGrid">
    <div class="loading">⏳ Mahsulotlar yuklanmoqda...</div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalImage" style="width:100%; border-radius:10px;">
        <h2 id="modalName" style="margin-top:10px;"></h2>
        <div id="modalPrice" class="product-price"></div>
        <p>📏 Razmer: <span id="modalSize"></span></p>
        <p>🎂 Yosh: <span id="modalAge"></span></p>
        <div class="card-buttons">
            <button class="btn btn-wishlist" onclick="addToWishlistFromModal()">⭐ Istaklarga</button>
            <button class="btn btn-cart" onclick="addToCartFromModal()">🛒 Savatchaga</button>
        </div>
    </div>
</div>

<!-- Wishlist -->
<div id="wishlistSidebar" class="sidebar">
    <div style="display:flex; justify-content:space-between;">
        <h2>⭐ Istaklar</h2>
        <span class="close" onclick="closeWishlist()">&times;</span>
    </div>
    <div id="wishlistItems"></div>
</div>

<!-- Cart -->
<div id="cartSidebar" class="sidebar">
    <div style="display:flex; justify-content:space-between;">
        <h2>🛒 Savatcha</h2>
        <span class="close" onclick="closeCart()">&times;</span>
    </div>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
    <button class="checkout-btn" onclick="checkout()">✅ Buyurtma berish</button>
</div>

<!-- Settings -->
<div id="settingsSidebar" class="sidebar">
    <div style="display:flex; justify-content:space-between;">
        <h2>⚙️ Sozlamalar</h2>
        <span class="close" onclick="closeSettings()">&times;</span>
    </div>
    <button class="checkout-btn" onclick="goToAdmin()">👑 Admin panelga o'tish</button>
</div>

<script>
// MAHSULOTLARNI YUKLASH
let allProducts = [];
let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let currentProduct = null;

async function loadProducts() {
    try {
        const response = await fetch('/api/products');
        allProducts = await response.json();
        displayProducts();
        updateCounts();
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('productsGrid').innerHTML = '<div class="loading">❌ Yuklashda xatolik</div>';
    }
}

function displayProducts() {
    const grid = document.getElementById('productsGrid');
    if (allProducts.length === 0) {
        grid.innerHTML = '<div class="loading">📭 Mahsulot yo\'q</div>';
        return;
    }
    
    grid.innerHTML = allProducts.map(p => `
        <div class="product-card" onclick="openModal('${p.id}')">
            <img class="product-image" src="${p.image_url}" onerror="this.src='https://placehold.co/300x300/bf40ff/white?text=No+Image'">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${(p.price || 0).toLocaleString()} so'm</div>
                <div class="card-buttons">
                    <button class="btn btn-wishlist" onclick="event.stopPropagation(); addToWishlist('${p.id}')">⭐</button>
                    <button class="btn btn-cart" onclick="event.stopPropagation(); addToCart('${p.id}')">🛒</button>
                </div>
            </div>
        </div>
    `).join('');
}

function updateCounts() {
    document.getElementById('wishlistCount').innerText = wishlist.length;
    document.getElementById('cartCount').innerText = cart.length;
}

// MODAL
function openModal(id) {
    currentProduct = allProducts.find(p => p.id === id);
    if (!currentProduct) return;
    
    document.getElementById('modalImage').src = currentProduct.image_url;
    document.getElementById('modalName').innerText = currentProduct.name;
    document.getElementById('modalPrice').innerHTML = `${(currentProduct.price || 0).toLocaleString()} so'm`;
    document.getElementById('modalSize').innerText = currentProduct.size || 'Yo\'q';
    document.getElementById('modalAge').innerText = currentProduct.age || 'Yo\'q';
    
    document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

// WISHLIST
function addToWishlist(id) {
    const product = allProducts.find(p => p.id === id);
    if (!wishlist.find(w => w.id === id)) {
        wishlist.push(product);
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        updateCounts();
        alert('⭐ Istaklarga qo\'shildi!');
    }
}

function addToWishlistFromModal() {
    addToWishlist(currentProduct.id);
}

function openWishlist() {
    const container = document.getElementById('wishlistItems');
    if (wishlist.length === 0) {
        container.innerHTML = '<div class="loading">⭐ Bo\'sh</div>';
    } else {
        container.innerHTML = wishlist.map(item => `
            <div class="cart-item">
                <img class="item-image" src="${item.image_url}">
                <div style="flex:1">
                    <b>${item.name}</b><br>
                    ${(item.price || 0).toLocaleString()} so'm
                </div>
                <button onclick="removeFromWishlist('${item.id}')" style="background:#ff4040; border:none; padding:5px 10px; border-radius:5px;">❌</button>
            </div>
        `).join('');
    }
    document.getElementById('wishlistSidebar').classList.add('active');
}

function removeFromWishlist(id) {
    wishlist = wishlist.filter(w => w.id !== id);
    localStorage.setItem('wishlist', JSON.stringify(wishlist));
    updateCounts();
    openWishlist();
}

function closeWishlist() {
    document.getElementById('wishlistSidebar').classList.remove('active');
}

// CART
function addToCart(id) {
    const product = allProducts.find(p => p.id === id);
    if (!cart.find(c => c.id === id)) {
        cart.push(product);
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCounts();
        alert('🛒 Savatchaga qo\'shildi!');
    }
}

function addToCartFromModal() {
    addToCart(currentProduct.id);
}

function openCart() {
    const container = document.getElementById('cartItems');
    const totalDiv = document.getElementById('cartTotal');
    
    if (cart.length === 0) {
        container.innerHTML = '<div class="loading">🛒 Bo\'sh</div>';
        totalDiv.innerHTML = '';
    } else {
        const total = cart.reduce((sum, item) => sum + (item.price || 0), 0);
        container.innerHTML = cart.map(item => `
            <div class="cart-item">
                <img class="item-image" src="${item.image_url}">
                <div style="flex:1">
                    <b>${item.name}</b><br>
                    ${(item.price || 0).toLocaleString()} so'm<br>
                    📏 ${item.size || '-'} | 🎂 ${item.age || '-'}
                </div>
                <button onclick="removeFromCart('${item.id}')" style="background:#ff4040; border:none; padding:5px 10px; border-radius:5px;">❌</button>
            </div>
        `).join('');
        totalDiv.innerHTML = `<h3>💰 Jami: ${total.toLocaleString()} so'm</h3>`;
    }
    document.getElementById('cartSidebar').classList.add('active');
}

function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCounts();
    openCart();
}

function closeCart() {
    document.getElementById('cartSidebar').classList.remove('active');
}

// BUYURTMA
function checkout() {
    if (cart.length === 0) {
        alert('Savatcha bo\'sh!');
        return;
    }
    
    const total = cart.reduce((sum, item) => sum + (item.price || 0), 0);
    alert(`✅ Buyurtma qabul qilindi!\n\nJami: ${total.toLocaleString()} so'm\n\nOperator tez orada aloqaga chiqadi.`);
    
    cart = [];
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCounts();
    closeCart();
}

// SOZLAMALAR
function openSettings() {
    document.getElementById('settingsSidebar').classList.add('active');
}

function closeSettings() {
    document.getElementById('settingsSidebar').classList.remove('active');
}

function goToAdmin() {
    const pass = prompt('Admin panelga kirish uchun parol:');
    if (pass === '4321') {
        window.location.href = 'admin.html';
    } else {
        alert('Parol xato!');
    }
}

// ISHGA TUSHIRISH
loadProducts();
setInterval(loadProducts, 5000); // 5 soniyada yangilash
</script>
</body>
</html>
