<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: sans-serif; 
            background: linear-gradient(180deg, #2e0249 0%, #570a57 100%); 
            color: #fff; min-height: 100vh; overflow-x: hidden;
        }

        header {
            background: rgba(0,0,0,0.8); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f806cc; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 18px; font-weight: 900; color: #f806cc; }
        .nav-right { display: flex; gap: 8px; }
        .btn-top { cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; border: 1px solid rgba(248, 6, 204, 0.4); }

        /* KATEGORIYALAR */
        .cats { text-align: center; padding: 15px; overflow-x: auto; white-space: nowrap; margin-bottom: 5px; }
        .cats button { 
            padding: 8px 16px; margin: 4px; border: 1px solid #f806cc; 
            background: transparent; color: #fff; cursor: pointer; border-radius: 20px; font-size: 12px;
        }
        .cats button.active { background: #f806cc; box-shadow: 0 0 10px #f806cc; }

        /* GRID 3 QATOR */
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 8px; padding: 10px 4%; max-width: 1000px; margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid rgba(248, 6, 204, 0.2);
            overflow: hidden; text-align: center; padding-bottom: 10px; cursor: pointer;
        }
        .card img { width: 100%; height: 110px; object-fit: cover; display: block; }
        .card h4 { margin: 6px 0 3px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
        .price { color: #00ffab; font-weight: bold; font-size: 13px; margin-bottom: 8px; }

        /* ADMIN PANEL (O'rtada chiqadigan qilib to'g'irlandi) */
        #admin-panel {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: #1a0033; z-index: 4000; 
            padding: 25px; border-radius: 20px; border: 2px solid #f806cc; box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        /* MODAL */
        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        .m-box {
            background: #2e0249; padding: 20px; border-radius: 20px; max-width: 340px; width: 90%;
            text-align: center; border: 2px solid #f806cc; position: relative;
        }
        .close { position: absolute; top: 5px; right: 15px; font-size: 30px; cursor: pointer; color: #fff; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
            .card img { height: 95px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR</div>
    <div class="nav-right">
        <div class="btn-top" onclick="askAdmin()">⚙️ Sozlamalar</div>
        <div class="btn-top" onclick="finalOrder()">🛒 Yuborish (<span id="cart-ui">0</span>)</div>
    </div>
</header>

<div class="cats" id="cat-menu">
    <button onclick="renderAll('Hammasi', this)" class="active">Barchasi</button>
    <button onclick="renderAll('Erkaklar', this)">Erkaklar</button>
    <button onclick="renderAll('Ayollar', this)">Ayollar</button>
    <button onclick="renderAll('Bolalar', this)">Bolalar</button>
</div>

<div id="admin-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f806cc; margin-bottom: 15px;">
        <h2 style="margin: 0; font-size: 20px;">Admin Sozlamalar</h2>
        <button onclick="closeAdmin()" style="background: #f806cc; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor:pointer;">Yopish</button>
    </div>
    <p style="font-size: 14px; opacity: 0.8;">Bu yerda mahsulotlarni boshqarish tizimi ulanadi.</p>
    <button onclick="window.location.href='https://t.me/Jahongir3616'" style="background: #0088cc; color: white; width: 100%; padding: 12px; border-radius: 10px; border:none; font-weight:bold; cursor:pointer;">Telegram Adminga o'tish</button>
</div>

<div class="grid" id="main_box"></div>

<div id="modal">
    <div class="m-box">
        <span class="close" onclick="closeM()">&times;</span>
        <img id="m-img" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:10px;">
        <h3 id="m-name" style="color:#f806cc; margin:5px 0;"></h3>
        <div id="m-price" style="font-size:20px; color:#00ffab; font-weight:bold; margin-bottom:10px;"></div>
        <div style="text-align:left; font-size:13px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
            <p><b>📏 O'lcham:</b> <span id="m-size"></span></p>
            <p><b>👶 Yosh:</b> <span id="m-age"></span></p>
            <p><b>📝 Izoh:</b> <span id="m-desc"></span></p>
        </div>
        <button onclick="addToCart()" style="width:100%; margin-top:15px; background:#f806cc; border:none; color:white; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold;">SAVATGA SOLISH</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let basket = [];
    let selectedItem = {};

    function askAdmin() {
        let p = prompt("Maxfiy parolni kiriting:");
        if (p === "4321") document.getElementById('admin-panel').style.display = "block";
        else if (p !== null) alert("Xato!");
    }
    function closeAdmin() { document.getElementById('admin-panel').style.display = "none"; }

    function renderAll(catName, btn) {
        const box = document.getElementById('main_box');
        document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        db.ref('products').on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            Object.keys(data).reverse().forEach(key => {
                let p = data[key];
                if(catName === 'Hammasi' || p.category === catName) {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = function() {
                        openModal(p.name, p.price, p.images[0], p.size, p.age, p.desc);
                    };
                    card.innerHTML = `<img src="${p.images[0]}"><h4>${p.name}</h4><div class="price">${parseInt(p.price).toLocaleString()} so'm</div>`;
                    box.appendChild(card);
                }
            });
        });
    }

    function openModal(n, p, i, s, a, d) {
        selectedItem = {name: n, price: p, img: i};
        document.getElementById('m-name').innerText = n;
        document.getElementById('m-price').innerText = parseInt(p).toLocaleString() + " so'm";
        document.getElementById('m-img').src = i;
        document.getElementById('m-size').innerText = s || "-";
        document.getElementById('m-age').innerText = a || "-";
        document.getElementById('m-desc').innerText = d || "-";
        document.getElementById('modal').style.display = "flex";
    }
    function closeM() { document.getElementById('modal').style.display = "none"; }

    function addToCart() {
        basket.push(selectedItem);
        document.getElementById('cart-ui').innerText = basket.length;
        closeM();
    }

    function finalOrder() {
        if(basket.length === 0) return alert("Savat bo'sh!");
        let text = "🛍 *YANGI BUYURTMA*:\n\n";
        basket.forEach((v, i) => {
            text += `${i+1}. *${v.name}*\n💰 Narxi: ${v.price} so'm\n[.](${v.img})\n`;
        });
        // [.](${v.img}) bu format Telegramda rasmni matn bilan birga chiqarishga yordam beradi
        window.location.href = `https://t.me/Jahongir3616?text=${encodeURIComponent(text)}&parse_mode=Markdown`;
    }

    renderAll('Hammasi');
</script>
</body>
</html>
