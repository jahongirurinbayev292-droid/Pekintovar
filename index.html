<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>O'lmas Shop</title>
<style>
  body { background:#0a0014; color:white; font-family:'Poppins',sans-serif; }
  h1 { text-align:center; color:#b366ff; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px; }
  .card {
    background:#200045; border:1px solid #8000ff; border-radius:10px;
    box-shadow:0 0 15px #8000ff; padding:10px; text-align:center; transition:0.3s;
  }
  .card:hover { transform:scale(1.05); }
  .card img { width:100%; border-radius:8px; }
  .btn { background:#8000ff; color:white; border:none; border-radius:5px; padding:5px 10px; cursor:pointer; margin:3px; }
  .modal {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(10,0,20,0.94); justify-content:center; align-items:center;
  }
  .modal-content { background:#220050; padding:20px; border-radius:10px; text-align:center; }
</style>
</head>
<body>

<h1>🛍 O'lmas Shop</h1>
<div class="grid" id="productGrid"></div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script type="module">
import { initializeApp } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js)";
import { getDatabase, ref, get } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js)";
import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");

async function loadProducts() {
  const snapshot = await get(ref(db, "products"));
  if (!snapshot.exists()) return;
  const grid = document.getElementById("productGrid");
  const data = snapshot.val();
  for (let id in data) {
    const p = data[id];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${p.image_url}">
      <h3>${p.price} so'm</h3>
      <p>Razmer: ${p.size || '-'} | Yosh: ${p.age || '-'}</p>
      <button class="btn" onclick='view("${id}")'>Ko'rish</button>
      <button class="btn" onclick='addToCart("${id}")'>+ Savatcha</button>
      <button class="btn" onclick='addToWish("${id}")'>❤️</button>
    `;
    grid.appendChild(card);
  }
}

window.view = function(id) {
  get(ref(db, "products/" + id)).then(snap => {
    const p = snap.val();
    const modal = document.getElementById("modal");
    const content = document.getElementById("modalContent");
    content.innerHTML = `
      <img src="${p.image_url}" width="250"><br><br>
      <b>${p.price} so'm</b><br>
      Razmer: ${p.size || '-'}<br>
      Yosh: ${p.age || '-'}<br><br>
      <button class="btn" onclick="closeModal()">Yopish</button>
    `;
    modal.style.display = "flex";
  });
};

window.closeModal = () => document.getElementById("modal").style.display = "none";

window.addToCart = function(id) {
  cart.push(id);
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Savatchaga qo'shildi!");
};

window.addToWish = function(id) {
  wishlist.push(id);
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  alert("Yoqtirganlarga qo'shildi!");
};

window.checkout = async function() {
  let snapshot = await get(ref(db, "products"));
  if (!snapshot.exists()) return;
  let data = snapshot.val();
  let orderItems = cart.map(id => data[id]);
  let text = "🛍 *Yangi buyurtma*\n\n";
  orderItems.forEach(p => {
    text += `💎 Narx: ${p.price} so'm\n👕 Razmer: ${p.size}\n🧒 Yosh: ${p.age}\n🔗 ${p.image_url}\n\n`;
  });

  // Telegram mesaj yuborish
  fetch(`[api.telegram.org](https://api.telegram.org/botYOUR_TELEGRAM_BOT_TOKEN/sendMessage)`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: "@Jahongir3616",
      text: text,
      parse_mode: "Markdown"
    })
  });

  alert("Buyurtmangiz yuborildi!");
  cart = [];
  localStorage.removeItem("cart");
};

loadProducts();
</script>

<hr>
<div style="text-align:center;">
  <button class="btn" onclick="checkout()">🛒 Sotib olish</button>
  <button class="btn" onclick="window.location='admin.html'">⚙️ Admin panel</button>
</div>

</body>
</html>
