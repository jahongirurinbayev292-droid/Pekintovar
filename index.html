<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: sans-serif; 
            background: linear-gradient(180deg, #2e0249 0%, #570a57 100%); 
            color: #fff; min-height: 100vh;
        }

        /* HEADER */
        header {
            background: rgba(0,0,0,0.7); padding: 10px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f806cc; position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 18px; font-weight: 900; color: #f806cc; }
        .nav-right { display: flex; gap: 10px; }
        .btn-top { cursor: pointer; background: rgba(255,255,255,0.1); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; border: 1px solid rgba(248, 6, 204, 0.3); }

        /* ADMIN BO'LIMI (YASHIRIN) */
        #admin-panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a0033; z-index: 3000; padding: 20px; overflow-y: auto;
        }

        /* GRID 3 QATOR */
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 8px; padding: 10px 4%; max-width: 1000px; margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.08); border-radius: 12px; 
            border: 1px solid rgba(248, 6, 204, 0.2);
            overflow: hidden; text-align: center; padding-bottom: 10px; cursor: pointer;
        }
        .card img { width: 100%; height: 110px; object-fit: cover; display: block; pointer-events: none; }
        .card h4 { margin: 6px 0 3px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
        .price { color: #00ffab; font-weight: bold; font-size: 13px; margin-bottom: 8px; }

        /* MODAL */
        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
        }
        .m-box {
            background: #2e0249; padding: 25px; border-radius: 20px; max-width: 340px; width: 90%;
            text-align: center; border: 2px solid #f806cc; position: relative;
        }
        .close { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; color: #fff; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
            .card img { height: 95px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR</div>
    <div class="nav-right">
        <div class="btn-top" onclick="goToAdmin()">⚙️ Admin</div>
        <div class="btn-top" onclick="sendOrder()">🛒 Savat (<span id="cart-num">0</span>)</div>
    </div>
</header>

<div id="admin-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f806cc; padding-bottom: 10px;">
        <h2>Admin Sozlamalari</h2>
        <button onclick="closeAdmin()" style="background: #f806cc; color: white; border: none; padding: 10px; border-radius: 5px;">Yopish</button>
    </div>
    <div style="margin-top: 20px;">
        <p>Bu yerda siz mahsulotlarni boshqarishingiz mumkin.</p>
        <button onclick="window.location.href='https://t.me/Jahongir3616'" style="background: #0088cc; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px;">Telegram orqali bog'lanish</button>
        </div>
</div>

<div class="grid" id="main_box"></div>

<div id="modal">
    <div class="m-box">
        <span class="close" onclick="closeM()">&times;</span>
        <img id="m-img" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:15px;">
        <h3 id="m-title" style="color:#f806cc; margin:0 0 10px 0;"></h3>
        <div id="m-price" style="font-size:22px; color:#00ffab; font-weight:bold; margin-bottom:15px;"></div>
        <div style="text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; font-size: 14px;">
            <p><b>📏 O'lcham:</b> <span id="m-size"></span></p>
            <p><b>👶 Yosh:</b> <span id="m-age"></span></p>
            <p><b>📝 Izoh:</b> <span id="m-desc"></span></p>
        </div>
        <button onclick="addToCart()" style="width:100%; margin-top:20px; background:#f806cc; border:none; color:white; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold;">SAVATGA QO'SHISH</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myCart = [];
    let activeItem = {};

    // 1. ADMIN TUGMASI (4321 kodi bilan bo'limga o'tish)
    function goToAdmin() {
        let code = prompt("Admin parolini kiriting:");
        if (code === "4321") {
            document.getElementById('admin-panel').style.display = "block";
        } else if(code !== null) {
            alert("Parol xato!");
        }
    }
    function closeAdmin() { document.getElementById('admin-panel').style.display = "none"; }

    // 2. MAHSULOTLARNI YUKLASH (3 QATOR)
    function loadData() {
        const box = document.getElementById('main_box');
        db.ref('products').on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            Object.keys(data).reverse().forEach(id => {
                let p = data[id];
                let card = document.createElement('div');
                card.className = 'card';
                // Mahsulot ustidan bosganda ma'lumotlarni ko'rsatish
                card.onclick = function() {
                    openModal(p.name, p.price, p.images[0], p.size, p.age, p.desc);
                };
                card.innerHTML = `
                    <img src="${p.images[0]}">
                    <h4>${p.name}</h4>
                    <div class="price">${parseInt(p.price).toLocaleString()}</div>
                `;
                box.appendChild(card);
            });
        });
    }

    // 3. MODAL OYNASI
    function openModal(n, p, i, s, a, d) {
        activeItem = {name: n, price: p};
        document.getElementById('m-title').innerText = n;
        document.getElementById('m-price').innerText = parseInt(p).toLocaleString() + " so'm";
        document.getElementById('m-img').src = i;
        document.getElementById('m-size').innerText = s || "Mavjud emas";
        document.getElementById('m-age').innerText = a || "Noma'lum";
        document.getElementById('m-desc').innerText = d || "Izoh yo'q";
        document.getElementById('modal').style.display = "flex";
    }
    function closeM() { document.getElementById('modal').style.display = "none"; }

    // 4. SAVAT VA BUYURTMA
    function addToCart() {
        myCart.push(activeItem);
        document.getElementById('cart-num').innerText = myCart.length;
        closeM();
    }
    function sendOrder() {
        if(myCart.length === 0) return alert("Savat bo'sh!");
        let text = "Yangi Buyurtma:\n\n";
        myCart.forEach((v, i) => text += `${i+1}. ${v.name} (${v.price} so'm)\n`);
        window.location.href = `https://t.me/Jahongir3616?text=${encodeURIComponent(text)}`;
    }

    loadData();
</script>
</body>
</html>
