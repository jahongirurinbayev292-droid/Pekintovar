<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar Do'koni</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f7; margin: 0; padding-bottom: 30px; }
        header { background: #0088cc; color: white; padding: 15px; text-align: center; position: sticky; top: 0; }
        .admin-btn { position: absolute; right: 10px; top: 15px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 5px; cursor: pointer; }
        #adminPanel { display: none; background: white; margin: 15px; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #adminPanel input, #adminPanel select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .save-btn { background: #28a745; color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .price { color: #0088cc; font-weight: bold; margin: 5px 0; }
        .buy-btn { background: #0088cc; color: white; border: none; width: 90%; padding: 8px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h3 style="margin:0;">🛍 Pekin Tovar</h3>
    <button class="admin-btn" onclick="toggleAdmin()">⚙️</button>
</header>

<div id="adminPanel">
    <input type="text" id="name" placeholder="Nomi">
    <input type="text" id="price" placeholder="Narxi">
    <select id="cat">
        <option value="Bolalar">Bolalar</option>
        <option value="Kiyimlar">Kiyimlar</option>
        <option value="Oyoq kiyim">Oyoq kiyim</option>
    </select>
    <input type="file" id="photo" accept="image/*">
    <button class="save-btn" id="uploadBtn" onclick="uploadProduct()">Saqlash</button>
</div>

<div id="products-container"></div>

<script>
    // Sizning yangi Firebase ma'lumotlaringiz
    const firebaseConfig = {
        apiKey: "AIzaSyCJW4P9S40gEWD5FZfFCZFdZLAcyJB5GYk",
        authDomain: "pekin-tavor.firebaseapp.com",
        projectId: "pekin-tavor",
        storageBucket: "pekin-tavor.firebasestorage.app",
        messagingSenderId: "835006337740",
        appId: "1:835006337740:web:0649dcd1f9eb0549a0e869"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    function toggleAdmin() {
        if(prompt("Parol?") === "2222") {
            const p = document.getElementById('adminPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }
    }

    async function uploadProduct() {
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const cat = document.getElementById('cat').value;
        const file = document.getElementById('photo').files[0];
        const btn = document.getElementById('uploadBtn');

        if(!name || !price || !file) return alert("Hamma joyni to'ldiring!");
        btn.disabled = true; btn.innerText = "Yuklanmoqda...";

        const ref = storage.ref('products/' + Date.now() + "_" + file.name);
        await ref.put(file);
        const imgUrl = await ref.getDownloadURL();

        await db.ref('products').push({ name, price, cat, imgUrl });
        alert("Tayyor!"); location.reload();
    }

    db.ref('products').on('value', (s) => {
        const data = s.val();
        const cont = document.getElementById('products-container');
        cont.innerHTML = '';
        for(let id in data) {
            cont.innerHTML += `
                <div class="card">
                    <img src="${data[id].imgUrl}">
                    <h4>${data[id].name}</h4>
                    <p class="price">${data[id].price}</p>
                    <button class="buy-btn">Sotib olish</button>
                </div>`;
        }
    });
</script>
</body>
</html>
