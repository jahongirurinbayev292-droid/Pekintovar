<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #ff00aa; --bg: #0f0c29; --card: #1b1b3a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-top: 150px; }
        header { position: fixed; top:0; width:100%; background: var(--p); padding: 12px 15px; display:flex; justify-content:space-between; align-items:center; z-index:1001; box-sizing:border-box;}
        .search-area { position: fixed; top: 48px; width:100%; background:#111; padding:10px; z-index:1000; box-sizing:border-box; }
        .search-area input { width:100%; padding:10px; border-radius:20px; border:1px solid var(--p); background:#000; color:white; outline:none; }
        .cat-nav { position: fixed; top: 96px; width:100%; background:#111; overflow-x:auto; white-space:nowrap; padding:10px; z-index:1000; border-bottom:2px solid var(--p); box-sizing:border-box;}
        .cat-btn { background:var(--p); color:white; padding:7px 15px; border-radius:20px; border:none; margin-right:5px; font-size:11px; font-weight:bold; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .card img { width: 100%; height: 110px; object-fit: cover; }
        .price { font-size: 11px; text-align: center; color: var(--p); padding: 6px; font-weight:bold; }
        .page { display: none; padding: 10px; }
        .active { display: block; }
        #cart-count { background:white; color:var(--p); border-radius:50%; padding:2px 7px; font-size:12px; position:absolute; top:5px; right:42px; font-weight:bold;}
        .btn { background: var(--p); color:white; width:100%; padding:15px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>

    <header>
        <b onclick="location.reload()">PEKIN TAVOR</b>
        <div style="position:relative">
            <span id="cart-count">0</span>
            <i class="fa-solid fa-cart-shopping" onclick="showPage('cart')" style="margin-right:15px; cursor:pointer;"></i>
            <i class="fa-solid fa-gear" onclick="let p=prompt('Admin paroli:'); if(p==='4321') window.location.href='admin.html'"></i>
        </div>
    </header>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Mahsulot qidirish..." onkeyup="search()">
    </div>

    <div class="cat-nav" id="cat-list">
        <button class="cat-btn" onclick="loadP('all')">Hammasi</button>
    </div>

    <div id="home" class="page active">
        <div class="grid" id="p-display"></div>
        
        <div style="margin:25px 5px; background:var(--card); padding:15px; border-radius:12px; border:1px solid var(--p)">
            <h4>Sizga nima kerak? (Maxsus buyurtma)</h4>
            <textarea id="wishMsg" style="width:100%; background:#000; color:white; border-radius:8px; border:1px solid #444; padding:10px; box-sizing:border-box;" rows="3"></textarea>
            <button class="btn" style="margin-top:10px;" onclick="sendWish()">Adminga yozish</button>
        </div>
    </div>

    <div id="cart" class="page">
        <h3>Savat</h3>
        <div id="cart-items"></div>
        <button class="btn" onclick="order()">@Jahongir3616 ga yuborish</button>
        <button class="btn" style="background:#444; margin-top:10px;" onclick="showPage('home')">Orqaga</button>
    </div>

    <script>
        const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let cart = [];
        let allP = [];

        db.ref('categories').on('value', s => {
            const nav = document.getElementById('cat-list');
            nav.innerHTML = `<button class="cat-btn" onclick="loadP('all')">Hammasi</button>`;
            if(s.val()) Object.values(s.val()).forEach(v => {
                nav.innerHTML += `<button class="cat-btn" onclick="loadP('${v}')">${v}</button>`;
            });
        });

        function loadP(f) {
            db.ref('products').on('value', s => {
                allP = s.val() ? Object.values(s.val()) : [];
                render(allP.filter(p => f === 'all' || p.cat === f));
            });
        }

        function render(data) {
            const d = document.getElementById('p-display');
            d.innerHTML = data.map(p => `
                <div class="card" onclick="addToCart('${p.img}','${p.price}','${p.name}')">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="price">${p.price} so'm</div>
                </div>`).join('');
        }

        function search() {
            let v = document.getElementById('searchInput').value.toLowerCase();
            render(allP.filter(p => p.name.toLowerCase().includes(v)));
        }

        function addToCart(img, price, name) {
            cart.push({img, price, name});
            document.getElementById('cart-count').innerText = cart.length;
            const items = document.getElementById('cart-items');
            items.innerHTML = cart.map(i => `<div style="padding:10px; border-bottom:1px solid #333;">${i.name} - ${i.price}</div>`).join('');
            alert("Qo'shildi!");
        }

        function order() {
            if(!cart.length) return;
            let m = "📦 BUYURTMA:%0A";
            cart.forEach((i, n) => m += `%0A${n+1}. ${i.name}%0A💰 ${i.price}%0A🖼 ${i.img}%0A`);
            window.location.href = `https://t.me/Jahongir3616?text=${m}`;
        }

        function sendWish() {
            let m = document.getElementById('wishMsg').value;
            if(m) { db.ref('wishes').push({msg: m, time: new Date().toLocaleString()}); alert("Adminga ketdi!"); document.getElementById('wishMsg').value=""; }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        loadP('all');
    </script>
</body>
</html>
