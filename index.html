<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor System</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #ff0055; --bg: #0d001a; --card: #1a0033; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-top: 120px; }
        
        header { position: fixed; top:0; width:100%; background: var(--p); padding: 12px; display: flex; justify-content: space-between; z-index: 1001; box-sizing: border-box; }
        
        .cat-bar { position: fixed; top: 50px; width: 100%; background: #111; overflow-x: auto; white-space: nowrap; padding: 10px; z-index: 1000; border-bottom: 2px solid var(--p); }
        .cat-btn { display: inline-block; background: var(--p); color: white; padding: 8px 15px; border-radius: 20px; margin-right: 8px; font-size: 13px; border: none; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card); border: 1px solid var(--p); border-radius: 10px; overflow: hidden; }
        .card img { width: 100%; height: 100px; object-fit: cover; }
        .price { font-size: 10px; text-align: center; color: var(--p); padding: 5px; font-weight: bold; }

        .page { display: none; padding: 20px; }
        .active { display: block; }
        
        .admin-box { background: #1a0033; border: 2px solid var(--p); border-radius: 20px; padding: 15px; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--p); background: #0d001a; color: white; box-sizing: border-box; }
        .btn { background: var(--p); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <b onclick="showPage('home')">PEKIN TAVOR</b>
        <div>
            <i class="fa-solid fa-cart-shopping" onclick="showPage('cart')" style="margin-right:20px;"></i>
            <i class="fa-solid fa-gear" onclick="checkAdmin()"></i>
        </div>
    </header>

    <div class="cat-bar" id="cat-list">
        <button class="cat-btn" onclick="loadProducts('all')">Hammasi</button>
    </div>

    <div id="home" class="page active">
        <div class="grid" id="product-grid"></div>
        <hr>
        <div class="admin-box">
            <h4>✍️ Istak bildirish</h4>
            <textarea id="wish-text" placeholder="Sizga qanday poyabzal kerak?"></textarea>
            <button class="btn" onclick="sendWish()">Adminga yuborish</button>
        </div>
    </div>

    <div id="cart" class="page">
        <h2>Savat</h2>
        <div id="cart-items">Savat bo'sh</div>
        <button class="btn" onclick="orderNow()">@Jahongir3616 ga yuborish</button>
    </div>

    <div id="admin" class="page">
        <div class="admin-box">
            <h3>📂 1. Menyularni Boshqarish</h3>
            <input type="text" id="new-cat" placeholder="Masalan: Erkaklar">
            <button class="btn" onclick="addCategory()">Bo'limni qo'shish</button>
        </div>

        <div class="admin-box">
            <h3>📤 2. Mahsulot Yuklash</h3>
            <input type="text" id="p-title" placeholder="Nomi">
            <input type="number" id="p-price" placeholder="Narxi">
            <input type="text" id="p-img" placeholder="Rasm URL linki">
            <select id="p-cat-select"></select>
            <button class="btn" onclick="addProduct()">Saytga chiqarish</button>
        </div>

        <div class="admin-box">
            <h3>📩 3. Mijozlar Istaklari</h3>
            <div id="wishes-list"></div>
        </div>
        <button class="btn" style="background:#444" onclick="showPage('home')">Chiqish</button>
    </div>

    <script>
        // FIREBASE SOZLAMALARI
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let cart = [];

        // 1. ADMINGA KIRISH
        function checkAdmin() {
            if(prompt("Parolni kiriting:") === "7777") showPage('admin');
            else alert("Xato!");
        }

        // 2. KATEGORIYALAR
        db.ref('categories').on('value', s => {
            const list = document.getElementById('cat-list');
            const select = document.getElementById('p-cat-select');
            list.innerHTML = `<button class="cat-btn" onclick="loadProducts('all')">Hammasi</button>`;
            select.innerHTML = "";
            if(s.val()) Object.values(s.val()).forEach(v => {
                list.innerHTML += `<button class="cat-btn" onclick="loadProducts('${v}')">${v}</button>`;
                select.innerHTML += `<option value="${v}">${v}</option>`;
            });
        });

        function addCategory() {
            const v = document.getElementById('new-cat').value;
            if(v) db.ref('categories').push(v);
        }

        // 3. MAHSULOTLAR
        function addProduct() {
            const data = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                cat: document.getElementById('p-cat-select').value
            };
            db.ref('products').push(data);
            alert("Qo'shildi!");
        }

        function loadProducts(filter) {
            db.ref('products').once('value', s => {
                const grid = document.getElementById('product-grid');
                grid.innerHTML = "";
                if(s.val()) Object.values(s.val()).forEach(p => {
                    if(filter === 'all' || p.cat === filter) {
                        grid.innerHTML += `
                            <div class="card" onclick="addToCart('${p.img}', '${p.price}', '${p.title}')">
                                <img src="${p.img}">
                                <div class="price">${p.price} so'm</div>
                            </div>`;
                    }
                });
            });
            showPage('home');
        }
        loadProducts('all');

        // 4. SAVAT VA TELEGRAM
        function addToCart(img, pr, tl) {
            cart.push({img, pr, tl});
            alert("Savatga tushdi!");
            document.getElementById('cart-items').innerHTML = cart.map(i => `<p>✅ ${i.tl} - ${i.pr}</p>`).join('');
        }

        function orderNow() {
            let msg = "YANGI BUYURTMA:%0A";
            cart.forEach(i => msg += `- ${i.tl}%0A💰 Narxi: ${i.pr}%0A🖼 Rasm: ${i.img}%0A%0A`);
            window.location.href = `https://t.me/Jahongir3616?text=${msg}`;
        }

        // 5. ISTAKLAR
        function sendWish() {
            const t = document.getElementById('wish-text').value;
            db.ref('wishes').push(t);
            alert("Yuborildi!");
        }

        db.ref('wishes').on('value', s => {
            const div = document.getElementById('wishes-list');
            div.innerHTML = s.val() ? Object.values(s.val()).map(w => `<p>📌 ${w}</p>`).join('') : "Hozircha yo'q";
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
