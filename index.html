<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor - Katalog</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        /* Asosiy ko'rinish */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
        }
        
        header {
            text-align: center;
            padding: 30px;
            background: #1a1a1a;
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Mahsulotlar setkasi */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Mahsulot kartochkasi */
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .price-tag {
            font-size: 22px;
            color: #e74c3c;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .detail-item b {
            color: #333;
        }

        /* Yuklanish holati */
        #loader {
            text-align: center;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>👟 PEKIN TAVOR</h1>
        <p>Barcha turdagi poyabzallar katalogi</p>
    </header>

    <div id="loader">Mahsulotlar yuklanmoqda...</div>
    <div class="product-grid" id="product-list"></div>

    <script>
        // 1. Firebase Sozlamalari (Sening bazang manzili)
        const firebaseConfig = {
            databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. Elementlarni tanlash
        const productList = document.getElementById('product-list');
        const loader = document.getElementById('loader');

        // 3. Ma'lumotlarni bazadan olish (Real-time)
        database.ref('products').on('value', (snapshot) => {
            loader.style.display = 'none'; // Yuklanish matnini yashirish
            productList.innerHTML = ""; // Oldingi ma'lumotlarni tozalash
            
            const data = snapshot.val();
            
            if (data) {
                // Yangi qo'shilgan mahsulotlar tepada chiqishi uchun teskari tartibda chiqaramiz
                const keys = Object.keys(data).reverse();
                
                keys.forEach(key => {
                    const item = data[key];
                    
                    // Rasm borligini tekshirish
                    const imageUrl = (item.images && item.images.length > 0) ? item.images[0] : 'https://via.placeholder.com/300x300?text=Rasm+Yoq';

                    // HTML kartochkani yaratish
                    const productCard = `
                        <div class="card">
                            <img src="${imageUrl}" alt="Pekin Tavor">
                            <div class="card-body">
                                <div class="product-name">${item.name || 'Pekin Tavor'}</div>
                                <div class="price-tag">${Number(item.price).toLocaleString()} so'm</div>
                                <div class="details">
                                    <div class="detail-item"><b>📏 O'lcham:</b> ${item.size || '-'}</div>
                                    <div class="detail-item"><b>👶 Yosh:</b> ${item.age || '-'}</div>
                                    <div class="detail-item"><b>📁 Kategoriya:</b> ${item.category || 'Hammasi'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    productList.innerHTML += productCard;
                });
            } else {
                productList.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Hozircha mahsulotlar qo'shilmagan.</p>";
            }
        }, (error) => {
            console.error("Firebase xatosi:", error);
            loader.innerHTML = "Ma'lumotlarni yuklashda xato yuz berdi.";
        });
    </script>
</body>
</html>
