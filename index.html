<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: sans-serif; 
            background: linear-gradient(180deg, #2e0249 0%, #570a57 100%); 
            color: #fff; min-height: 100vh;
        }

        /* HEADER */
        header {
            background: rgba(0,0,0,0.5); padding: 10px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f806cc; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 18px; font-weight: bold; color: #f806cc; }
        .nav-icons { display: flex; gap: 15px; }
        .btn-top { cursor: pointer; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px; font-size: 13px; }

        /* KATEGORIYA */
        .cats { text-align: center; padding: 15px; white-space: nowrap; overflow-x: auto; }
        .cats button { 
            padding: 6px 15px; margin: 3px; border: 1px solid #f806cc; 
            background: transparent; color: #fff; cursor: pointer; border-radius: 20px; font-size: 12px;
        }
        .cats button.active { background: #f806cc; }

        /* 3 QATORLI IXCHAM GRID */
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 8px; padding: 10px; max-width: 1000px; margin: 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.05); border-radius: 10px; 
            border: 1px solid rgba(248, 6, 204, 0.2);
            overflow: hidden; text-align: center; padding-bottom: 10px; transition: 0.2s;
        }
        .card img { width: 100%; height: 120px; object-fit: cover; display: block; }
        .card h4 { margin: 5px 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
        .price { color: #00ffab; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .add-cart { background: #f806cc; border: none; color: white; padding: 5px; border-radius: 4px; width: 90%; font-size: 10px; cursor: pointer; }

        /* MODAL OYNASI */
        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
        }
        .m-box {
            background: #2e0249; padding: 20px; border-radius: 15px; max-width: 320px; width: 90%;
            text-align: center; border: 2px solid #f806cc; position: relative;
        }
        .close { position: absolute; top: 5px; right: 15px; font-size: 25px; cursor: pointer; }

        @media (max-width: 500px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
            .card img { height: 100px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR</div>
    <div class="nav-icons">
        <div class="btn-top" onclick="checkAdmin()">⚙️ Admin</div>
        <div class="btn-top" onclick="sendToTelegram()">🛒 Savat (<span id="count">0</span>)</div>
    </div>
</header>

<div class="cats">
    <button onclick="load('Hammasi')" id="btn-all" class="active">Barchasi</button>
    <button onclick="load('Erkaklar')">Erkaklar</button>
    <button onclick="load('Ayollar')">Ayollar</button>
    <button onclick="load('Bolalar')">Bolalar</button>
</div>

<div class="grid" id="product_box"></div>

<div id="modal">
    <div class="m-box">
        <span class="close" onclick="closeM()">&times;</span>
        <img id="m-img" style="width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
        <h3 id="m-name" style="color:#f806cc; margin:5px 0;"></h3>
        <div id="m-price" style="font-size:20px; color:#00ffab; font-weight:bold; margin-bottom:10px;"></div>
        <div style="text-align:left; font-size:13px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
            <p><b>📏 O'lcham:</b> <span id="m-size"></span></p>
            <p><b>👶 Yosh:</b> <span id="m-age"></span></p>
            <p><b>📝 Izoh:</b> <span id="m-desc"></span></p>
        </div>
        <button onclick="addToCartModal()" style="width:100%; margin-top:15px; background:#f806cc; border:none; color:white; padding:10px; border-radius:5px; cursor:pointer;">SAVATGA QO'SHISH</button>
    </div>
</div>

<script>
    // 1. Firebase bog'lanish
    const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();

    let cartList = [];
    let currentItem = {};

    // 2. Admin tekshirish
    function checkAdmin() {
        if(prompt("Admin paroli:") === "4321") window.location.href = "https://t.me/Jahongir3616";
        else alert("Xato kod!");
    }

    // 3. Ma'lumotlarni yuklash
    function load(cat) {
        const box = document.getElementById('product_box');
        box.innerHTML = "Yuklanmoqda...";
        
        // Aktiv tugmani belgilash
        document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        let ref = db.ref('products');
        if(cat !== 'Hammasi') ref = ref.orderByChild('category').equalTo(cat);

        ref.on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return box.innerHTML = "Mahsulot yo'q.";

            Object.keys(data).reverse().forEach(key => {
                let p = data[key];
                box.innerHTML += `
                    <div class="card" onclick="openM('${p.name}', '${p.price}', '${p.images[0]}', '${p.size || 'M'}', '${p.age || '10+'}', '${p.desc || 'Yo'q'}')">
                        <img src="${p.images[0]}">
                        <h4>${p.name}</h4>
                        <div class="price">${parseInt(p.price).toLocaleString()}</div>
                        <button class="add-cart" onclick="event.stopPropagation(); quickAdd('${p.name}', '${p.price}')">Savat</button>
                    </div>
                `;
            });
        });
    }

    // 4. Modal Funksiyalari
    function openM(n, p, i, s, a, d) {
        currentItem = {name: n, price: p};
        document.getElementById('m-name').innerText = n;
        document.getElementById('m-price').innerText = parseInt(p).toLocaleString() + " so'm";
        document.getElementById('m-img').src = i;
        document.getElementById('m-size').innerText = s;
        document.getElementById('m-age').innerText = a;
        document.getElementById('m-desc').innerText = d;
        document.getElementById('modal').style.display = "flex";
    }
    function closeM() { document.getElementById('modal').style.display = "none"; }

    // 5. Savat Funksiyalari
    function quickAdd(n, p) {
        cartList.push({name: n, price: p});
        document.getElementById('count').innerText = cartList.length;
    }
    function addToCartModal() {
        cartList.push(currentItem);
        document.getElementById('count').innerText = cartList.length;
        closeM();
    }

    // 6. Buyurtmani yuborish
    function sendToTelegram() {
        if(cartList.length === 0) return alert("Savat bo'sh!");
        let msg = "Yangi Buyurtma:\n\n";
        cartList.forEach((item, i) => msg += `${i+1}. ${item.name} (${item.price} so'm)\n`);
        window.location.href = `https://t.me/Jahongir3616?text=${encodeURIComponent(msg)}`;
    }

    load('Hammasi');
</script>
</body>
</html>
