<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #ff00aa; --bg: #0f0c29; --card: #1b1b3a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-top: 110px; }
        header { position: fixed; top:0; width:100%; background: var(--p); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1001; box-sizing: border-box; }
        .cat-bar { position: fixed; top: 48px; width: 100%; background: #111; overflow-x: auto; white-space: nowrap; padding: 10px; z-index: 1000; border-bottom: 2px solid var(--p); }
        .cat-btn { display: inline-block; background: var(--p); color: white; padding: 7px 15px; border-radius: 20px; margin-right: 8px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .card img { width: 100%; height: 105px; object-fit: cover; background: #222; }
        .price { font-size: 10px; text-align: center; color: var(--p); padding: 5px; font-weight: bold; }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .btn { background: var(--p); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <b onclick="location.reload()">PEKIN TAVOR</b>
        <div>
            <i class="fa-solid fa-cart-shopping" onclick="showPage('cart')" style="margin-right:20px; cursor:pointer;"></i>
            <i class="fa-solid fa-gear" onclick="gotoAdmin()" style="cursor:pointer;"></i>
        </div>
    </header>

    <div class="cat-bar" id="category-nav">
        <button class="cat-btn" onclick="loadProducts('all')">Hammasi</button>
    </div>

    <div id="home" class="page active">
        <div class="grid" id="product-display"></div>
    </div>

    <div id="cart" class="page">
        <h2 style="color:var(--p)">Savat</h2>
        <div id="cart-items-list">Savat bo'sh</div>
        <button class="btn" style="margin-top:20px" onclick="checkout()">@Jahongir3616 ga yuborish</button>
        <button class="btn" style="background:#444; margin-top:10px" onclick="showPage('home')">Orqaga</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let myCart = [];

        function gotoAdmin() {
            if (prompt("Parol:") === "4321") window.location.href = "admin.html";
        }

        db.ref('categories').on('value', s => {
            const nav = document.getElementById('category-nav');
            nav.innerHTML = `<button class="cat-btn" onclick="loadProducts('all')">Hammasi</button>`;
            if(s.val()) Object.values(s.val()).forEach(name => {
                nav.innerHTML += `<button class="cat-btn" onclick="loadProducts('${name}')">${name}</button>`;
            });
        });

        function loadProducts(filter) {
            db.ref('products').on('value', s => {
                const grid = document.getElementById('product-display');
                grid.innerHTML = "";
                if(s.val()) Object.values(s.val()).forEach(p => {
                    if(filter === 'all' || p.cat === filter) {
                        grid.innerHTML += `
                            <div class="card" onclick="addToCart('${p.img}', '${p.price}', '${p.name}')">
                                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150?text=Rasm+Xato'">
                                <div class="price">${p.price} so'm</div>
                            </div>`;
                    }
                });
            });
        }
        loadProducts('all');

        function addToCart(img, pr, name) {
            myCart.push({img, pr, name});
            alert("Savatga qo'shildi!");
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = myCart.map(i => `<div style="padding:10px; border-bottom:1px solid #333;">✅ ${i.name} - ${i.pr} so'm</div>`).join('');
        }

        function checkout() {
            if(!myCart.length) return;
            let msg = "🚀 YANGI BUYURTMA:%0A%0A";
            myCart.forEach(i => msg += `📦 ${i.name}%0A💰 Narxi: ${i.pr}%0A🖼 Rasm: ${i.img}%0A%0A`);
            window.location.href = `https://t.me/Jahongir3616?text=${msg}`;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
