<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #2e0249; color: #fff; }
        header {
            background: rgba(0,0,0,0.9); padding: 10px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f806cc; position: sticky; top: 0; z-index: 1000;
        }
        .nav-btns { display: flex; gap: 8px; }
        .btn-top { background: rgba(255,255,255,0.1); border: 1px solid #f806cc; color: white; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }
        
        .cats { padding: 15px; text-align: center; overflow-x: auto; white-space: nowrap; }
        .cats button { background: none; border: 1px solid #f806cc; color: white; padding: 8px 15px; margin: 5px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .cats button.active { background: #f806cc; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(248,6,204,0.3); text-align: center; padding-bottom: 10px; position: relative; overflow: hidden; }
        .card img { width: 100%; height: 100px; object-fit: cover; }
        .card h4 { font-size: 10px; margin: 5px; height: 25px; overflow: hidden; }
        .wish-icon { position: absolute; top: 5px; right: 5px; color: rgba(255,255,255,0.5); font-size: 16px; cursor: pointer; z-index: 10; }
        .wish-icon.active { color: #f806cc; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .m-box { background: #2e0249; padding: 20px; border-radius: 20px; width: 90%; max-width: 340px; border: 2px solid #f806cc; position: relative; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; color:#f806cc;">PEKIN TAVOR</div>
    <div class="nav-btns">
        <div class="btn-top" onclick="adminGo()">⚙️ Sozlamalar</div>
        <div class="btn-top" onclick="yuborish()">🛒 Savat (<span id="cart-num">0</span>)</div>
    </div>
</header>

<div class="cats">
    <button class="active" onclick="yukla('Hammasi', this)">Hammasi</button>
    <button onclick="yukla('Erkaklar', this)">Erkaklar</button>
    <button onclick="yukla('Ayollar', this)">Ayollar</button>
    <button onclick="yukla('Bolalar', this)">Bolalar</button>
    <button onclick="yukla('Istaklar', this)" style="border-color: #ff4757;">❤️ Istaklar</button>
</div>

<div class="grid" id="main_grid"></div>

<div id="modal">
    <div class="m-box">
        <img id="m-img" style="width:100%; height:180px; object-fit:cover; border-radius:12px;">
        <h3 id="m-title" style="margin:10px 0; color:#f806cc;"></h3>
        <p id="m-price" style="color:#00ffab; font-weight:bold; font-size:18px;"></p>
        <div style="text-align:left; font-size:13px; margin-bottom:15px;">
            <p>📏 O'lcham: <span id="m-size"></span></p>
            <p>👶 Yosh: <span id="m-age"></span></p>
        </div>
        <button onclick="savatga()" style="width:100%; background:#f806cc; border:none; color:white; padding:12px; border-radius:8px; font-weight:bold;">SAVATGA QO'SHISH</button>
        <p onclick="document.getElementById('modal').style.display='none'" style="margin-top:15px; cursor:pointer; opacity:0.6;">Yopish</p>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myCart = [];
    let current = {};
    let wishes = JSON.parse(localStorage.getItem('myWishes')) || [];

    function adminGo() {
        if(prompt("Kod:") === "4321") window.location.href = "admin.html";
    }

    function yukla(cat, btn) {
        document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        db.ref('products').on('value', snap => {
            const box = document.getElementById('main_grid');
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            Object.keys(data).reverse().forEach(id => {
                let p = data[id];
                let isWish = wishes.includes(id);
                
                if(cat === 'Hammasi' || p.category === cat || (cat === 'Istaklar' && isWish)) {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <i class="fas fa-heart wish-icon ${isWish ? 'active' : ''}" onclick="toggleWish(event, '${id}')"></i>
                        <img src="${p.images[0]}" onclick="openItem('${id}')">
                        <h4>${p.name}</h4>
                        <div style="color:#00ffab; font-weight:bold; font-size:11px;">${parseInt(p.price).toLocaleString()} so'm</div>
                    `;
                    box.appendChild(card);
                }
            });
        });
    }

    function toggleWish(e, id) {
        e.stopPropagation();
        if(wishes.includes(id)) wishes = wishes.filter(i => i !== id);
        else wishes.push(id);
        localStorage.setItem('myWishes', JSON.stringify(wishes));
        yukla(document.querySelector('.cats button.active').innerText, document.querySelector('.cats button.active'));
    }

    function openItem(id) {
        db.ref('products/' + id).once('value', s => {
            let p = s.val();
            current = {name: p.name, price: p.price, img: p.images[0], size: p.size, age: p.age};
            document.getElementById('m-title').innerText = p.name;
            document.getElementById('m-price').innerText = parseInt(p.price).toLocaleString() + " so'm";
            document.getElementById('m-img').src = p.images[0];
            document.getElementById('m-size').innerText = p.size || "-";
            document.getElementById('m-age').innerText = p.age || "-";
            document.getElementById('modal').style.display = "flex";
        });
    }

    function savatga() {
        myCart.push(current);
        document.getElementById('cart-num').innerText = myCart.length;
        document.getElementById('modal').style.display = "none";
    }

    function yuborish() {
        if(myCart.length === 0) return alert("Savat bo'sh!");
        let text = "";
        myCart.forEach((v, i) => {
            text += `[\u200B](${v.img})` + 
                    `🛍 *BUYURTMA #${i+1}*\n` +
                    `📦 *Nomi:* ${v.name}\n` +
                    `💰 *Narxi:* ${parseInt(v.price).toLocaleString()} so'm\n` +
                    `📏 *O'lcham:* ${v.size || "-"}\n` +
                    `👶 *Yosh:* ${v.age || "-"}\n\n`;
        });
        window.location.href = `https://t.me/Jahongir3616?text=${encodeURIComponent(text)}&parse_mode=Markdown`;
    }

    yukla('Hammasi', document.querySelector('.cats button'));
</script>
</body>
</html>
