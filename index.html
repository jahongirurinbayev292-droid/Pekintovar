<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar - Do'kon</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .info { padding: 10px; text-align: center; }
        .price { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Pekin Tovar Do'koni</h2>
    <div class="grid" id="products"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('products').on('value', (s) => {
            const div = document.getElementById('products');
            div.innerHTML = '';
            s.forEach((c) => {
                const p = c.val();
                const img = Array.isArray(p.images) ? p.images[0] : p.image;
                div.innerHTML += `<div class="card">
                    <img src="${img}">
                    <div class="info"><b>${p.name}</b><br><span class="price">${p.price} so'm</span></div>
                </div>`;
            });
        });
    </script>
</body>
</html>
