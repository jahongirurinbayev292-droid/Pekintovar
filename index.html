<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-color: #0088cc; --bg: #f4f4f7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        
        /* Header va Bo'limlar */
        header { background: var(--main-color); color: white; padding: 20px; text-align: center; sticky: top; }
        .nav-categories { display: flex; overflow-x: auto; background: white; padding: 10px; gap: 10px; sticky: top; }
        .nav-item { background: #eee; padding: 8px 15px; border-radius: 20px; white-space: nowrap; font-size: 14px; cursor: pointer; }
        .nav-item.active { background: var(--main-color); color: white; }

        /* Mahsulotlar */
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 10px; text-align: center; }
        .card-body h3 { margin: 5px 0; font-size: 15px; height: 40px; overflow: hidden; }
        .price { color: var(--main-color); font-weight: bold; margin: 10px 0; }
        .buy-btn { background: var(--main-color); color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        h2.cat-title { padding: 10px 15px; margin: 10px 0 0 0; font-size: 18px; color: #555; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0;">🛍 Pekin Tovar Do'koni</h2>
</header>

<div class="nav-categories">
    <div class="nav-item active">Barchasi</div>
    <div class="nav-item">Bolalar</div>
    <div class="nav-item">Kiyimlar</div>
    <div class="nav-item">Oyoq kiyim</div>
</div>

<h2 class="cat-title">👶 Bolalar uchun</h2>
<div class="container" id="bolalar">
    <div class="card">
        <img src="https://images.uzum.uz/clv686lennt1tkof81bg/original.jpg">
        <div class="card-body">
            <h3>Bolalar kombinezoni</h3>
            <p class="price">180 000 UZS</p>
            <button class="buy-btn" onclick="order('Bolalar kombinezoni')">Sotib olish</button>
        </div>
    </div>
</div>

<h2 class="cat-title">👕 Kiyimlar</h2>
<div class="container" id="kiyimlar">
    <div class="card">
        <img src="https://images.uzum.uz/cm0u5dns99ouqbfre32g/original.jpg">
        <div class="card-body">
            <h3>Pekin Erkaklar kurtkasi</h3>
            <p class="price">350 000 UZS</p>
            <button class="buy-btn" onclick="order('Erkaklar kurtkasi')">Sotib olish</button>
        </div>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function order(item) {
        tg.sendData("Buyurtma: " + item);
        tg.close();
    }
</script>
</body>
</html>
