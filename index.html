<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
        .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100%; border-radius: 8px; max-height: 250px; object-fit: cover; }
        .price { color: #0088cc; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
        button { background: #0088cc; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">🛍 Bizning Mahsulotlar</h2>
    
    <div class="product-card">
        <img src="https://images.uzum.uz/clv686lennt1tkof81bg/original.jpg" alt="Kiyim">
        <h3>Sifatli Pekin Kiyimi</h3>
        <p class="price">150 000 UZS</p>
        <button onclick="order('Sifatli Pekin Kiyimi')">Sotib olish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function order(name) {
            tg.sendData("Buyurtma: " + name);
            tg.close();
        }
    </script>
</body>
</html>
