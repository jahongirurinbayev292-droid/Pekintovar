<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor | Rasmiy</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #ff0055; --bg: #0d001a; --card: #1a0033; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-top: 120px; }
        
        /* Header */
        header { position: fixed; top:0; width:100%; background: var(--p); padding: 12px 20px; display: flex; justify-content: space-between; z-index: 1001; box-sizing: border-box; }
        
        /* 307-rasmdagi Menyular */
        .cat-bar { 
            position: fixed; top: 48px; width: 100%; background: #111; 
            overflow-x: auto; white-space: nowrap; padding: 12px; 
            z-index: 1000; border-bottom: 2px solid var(--p);
        }
        .cat-item { 
            display: inline-block; background: var(--p); color: white; 
            padding: 8px 18px; border-radius: 25px; margin-right: 10px; 
            font-size: 14px; font-weight: bold; cursor: pointer; border: none;
        }

        /* 3 talik Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card); border: 1px solid var(--p); border-radius: 12px; overflow: hidden; }
        .card img { width: 100%; height: 110px; object-fit: cover; }
        .price { font-size: 11px; text-align: center; color: var(--p); padding: 6px; font-weight: bold; }

        /* Sahifalar */
        .page { display: none; padding: 20px; }
        .active { display: block; }
        .admin-card { background: #1a0033; border: 2px solid var(--p); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; 
            border: 1px solid var(--p); background: #0d001a; color: white; box-sizing: border-box;
        }
        .btn { background: var(--p); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <b onclick="location.reload()" style="font-size:20px;">PEKIN TAVOR</b>
        <div>
            <i class="fa-solid fa-cart-shopping" onclick="showPage('cart')" style="font-size:22px; margin-right:20px;"></i>
            <i class="fa-solid fa-gear" onclick="openAdmin()" style="font-size:22px;"></i>
        </div>
    </header>

    <div class="cat-bar" id="category-list">
        <button class="cat-item" onclick="loadProducts('all')">Hammasi</button>
    </div>

    <div id="home" class="page active">
        <div class="grid" id="products-grid"></div>
    </div>

    <div id="cart" class="page">
        <h2 style="color:var(--p)">Savat</h2>
        <div id="cart-content">Savat bo'sh</div>
        <button class="btn" style="margin-top:20px" onclick="sendToJahongir()">Buyurtmani yuborish (@Jahongir3616)</button>
        <button class="btn" style="background:#444; margin-top:10px" onclick="showPage('home')">Orqaga</button>
    </div>

    <div id="admin-panel" class="page">
        <div class="admin-card">
            <h3 style="color:var(--p)">📂 1. Menyularni Boshqarish</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="new-cat-name" placeholder="Masalan: Erkaklar kiyimi">
                <button onclick="addCat()" style="background:var(--p); border:none; color:white; padding:0 20px; border-radius:10px;">+</button>
            </div>
        </div>

        <div class="admin-card">
            <h3 style="color:var(--p)">📤 2. Mahsulot Yuklash</h3>
            <input type="text" id="p-title" placeholder="Mahsulot nomi">
            <input type="number" id="p-price" placeholder="Narxi (son)">
            <input type="text" id="p-img" placeholder="Rasm linki (URL)">
            <select id="p-category-select">
                <option value="all">Bo'limni tanlang</option>
            </select>
            <button class="btn" onclick="uploadP()">Saytga chiqarish</button>
        </div>
        <button class="btn" style="background:#444" onclick="showPage('home')">Chiqish</button>
    </div>

    <script>
        // FIREBASE ULANISHI
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myCart = [];

        // 1. Kategoriyalarni yuklash
        db.ref('categories').on('value', snap => {
            const bar = document.getElementById('category-list');
            const select = document.getElementById('p-category-select');
            bar.innerHTML = `<button class="cat-item" onclick="loadProducts('all')">Hammasi</button>`;
            select.innerHTML = `<option value="all">Bo'limni tanlang</option>`;
            
            if(snap.val()) {
                Object.values(snap.val()).forEach(name => {
                    bar.innerHTML += `<button class="cat-item" onclick="loadProducts('${name}')">${name}</button>`;
                    select.innerHTML += `<option value="${name}">${name}</option>`;
                });
            }
        });

        // 2. Mahsulotlarni yuklash (Filtr bilan)
        function loadProducts(filter) {
            db.ref('products').once('value', snap => {
                const grid = document.getElementById('products-grid');
                grid.innerHTML = "";
                if(snap.val()) {
                    Object.values(snap.val()).forEach(p => {
                        if(filter === 'all' || p.category === filter) {
                            grid.innerHTML += `
                                <div class="card" onclick="addToCart('${p.img}', '${p.price}', '${p.title}')">
                                    <img src="${p.img}">
                                    <div class="price">${Number(p.price).toLocaleString()} so'm</div>
                                </div>`;
                        }
                    });
                }
            });
            showPage('home');
        }
        loadProducts('all');

        // 3. Admin funksiyalari
        function openAdmin() {
            let pass = prompt("Admin kodini kiriting:");
            if(pass === "7777") showPage('admin-panel');
            else alert("Xato kod!");
        }

        function addCat() {
            const val = document.getElementById('new-cat-name').value;
            if(val) { db.ref('categories').push(val); document.getElementById('new-cat-name').value = ""; }
        }

        function uploadP() {
            const data = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                category: document.getElementById('p-category-select').value
            };
            if(data.img && data.price) {
                db.ref('products').push(data);
                alert("Mahsulot qo'shildi!");
                showPage('home');
            }
        }

        // 4. Savat va Telegram (@Jahongir3616)
        function addToCart(img, price, title) {
            myCart.push({img, price, title});
            alert("Savatga qo'shildi!");
            updateCartUI();
        }

        function updateCartUI() {
            const div = document.getElementById('cart-content');
            div.innerHTML = myCart.length ? myCart.map(i => `<div style="padding:10px; border-bottom:1px solid #333;">✅ ${i.title} - ${i.price} so'm</div>`).join('') : "Savat bo'sh";
        }

        function sendToJahongir() {
            if(!myCart.length) return alert("Savat bo'sh!");
            let text = "🚀 YANGI BUYURTMA:%0A%0A";
            myCart.forEach((item, index) => {
                text += `${index+1}. ${item.title}%0A💰 Narxi: ${item.price} so'm%0A🖼 Rasm: ${item.img}%0A%0A`;
            });
            window.location.href = `https://t.me/Jahongir3616?text=${text}`;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
