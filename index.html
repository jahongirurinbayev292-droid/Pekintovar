<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor | 2026 Store</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #ffd700; --bg: #0a0a0a; --card: #161616; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: white; }

        /* HEADER */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 5%; background: #000; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-weight: 900; color: var(--gold); font-size: 18px; }
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .icon-btn { cursor: pointer; position: relative; font-size: 18px; transition: 0.3s; }
        .icon-btn:hover { color: var(--gold); }
        .badge { position: absolute; top: -8px; right: -10px; background: red; color: white; font-size: 10px; padding: 2px 5px; border-radius: 10px; }
        .admin-btn { border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; border-radius: 5px; text-decoration: none; font-size: 12px; }

        /* SEARCH & FILTER */
        .filter-bar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #111; overflow-x: auto; }
        .filter-bar button { background: #222; border: none; color: #ccc; padding: 7px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .filter-bar button.active { background: var(--gold); color: #000; font-weight: bold; }

        /* 3 QATORLI GRID (Kichik mahsulotlar) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* ANIQLIK */
            gap: 15px;
            padding: 15px 5%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* MAHSULOT KARTASI */
        .p-card {
            background: var(--card); border-radius: 12px; overflow: hidden;
            border: 1px solid #222; transition: 0.3s; position: relative;
        }
        .p-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        
        /* Rasm o'lchami kichikroq */
        .p-card img { width: 100%; height: 200px; object-fit: cover; }
        
        .p-info { padding: 10px; }
        .p-info h4 { margin: 5px 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { color: var(--gold); font-weight: bold; font-size: 16px; margin-bottom: 8px; }

        /* SAVATGA QO'SHISH EFFEKTI (Neon Glow) */
        .add-btn {
            width: 100%; padding: 8px; background: transparent; border: 1px solid var(--gold);
            color: var(--gold); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s;
        }
        .add-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }
        
        .wish { position: absolute; top: 8px; right: 8px; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 20px; }
        .wish.active { color: #ff4757; }

        /* MOBILE OPTIMIZATSIYA */
        @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .grid { grid-template-columns: repeat(1, 1fr); } }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR 2026</div>
    <div class="nav-right">
        <a href="admin.html" class="admin-btn">ADMIN</a>
        <div class="icon-btn" onclick="showWish()">❤️<span id="w_count" class="badge">0</span></div>
        <div class="icon-btn" onclick="showCart()">🛒<span id="c_count" class="badge">0</span></div>
    </div>
</header>

<div class="filter-bar">
    <button onclick="load('Hammasi')" class="active">Barchasi</button>
    <button onclick="load('Erkaklar')">Erkaklar</button>
    <button onclick="load('Ayollar')">Ayollar</button>
    <button onclick="load('Bolalar')">Bolalar</button>
</div>

<div class="grid" id="product_box"></div>

<script>
    // Firebase bog'lash
    const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();

    let cartCount = 0;
    let wishCount = 0;

    function load(cat) {
        const box = document.getElementById('product_box');
        box.innerHTML = "<p>Yuklanmoqda...</p>";
        
        let ref = db.ref('products');
        if (cat !== 'Hammasi') ref = ref.orderByChild('category').equalTo(cat);

        ref.on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return box.innerHTML = "Mahsulot yo'q";

            Object.values(data).reverse().forEach(p => {
                box.innerHTML += `
                    <div class="p-card">
                        <div class="wish" onclick="toggleWish(this)">❤</div>
                        <img src="${p.images[0]}" alt="Kiyim">
                        <div class="p-info">
                            <h4>${p.name}</h4>
                            <div class="p-price">${p.price.toLocaleString()} so'm</div>
                            <button class="add-btn" onclick="addToCart(this)">SAVATGA QO'SHISH</button>
                        </div>
                    </div>
                `;
            });
        });
    }

    function toggleWish(el) {
        el.classList.toggle('active');
        el.classList.contains('active') ? wishCount++ : wishCount--;
        document.getElementById('w_count').innerText = wishCount;
    }

    function addToCart(btn) {
        cartCount++;
        document.getElementById('c_count').innerText = cartCount;
        
        // Neon Glow Effekt
        btn.innerText = "QO'SHILDI ✅";
        btn.style.borderColor = "#00ff00";
        btn.style.color = "#00ff00";
        
        setTimeout(() => {
            btn.innerText = "SAVATGA QO'SHISH";
            btn.style.borderColor = "";
            btn.style.color = "";
        }, 800);
    }

    load('Hammasi');
</script>

</body>
</html>
