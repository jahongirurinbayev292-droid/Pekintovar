<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar | Online Do'kon</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #7000ff; --bg: #f5f5f7; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 80px; background: #121212; color: white; }
        header { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 15px; position: sticky; top: 0; z-index: 100; }
        
        /* Menyular (Kategoriyalar) */
        .categories { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; background: #1a1a1a; }
        .cat-item { background: #333; padding: 8px 15px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 13px; }
        .cat-item.active { background: var(--main); }

        .container { padding: 12px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #222; border-radius: 12px; overflow: hidden; position: relative; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-info { padding: 10px; }
        .p-name { font-size: 13px; height: 36px; overflow: hidden; }
        .p-price { font-weight: bold; color: #bb86fc; font-size: 15px; margin: 5px 0; }
        .add-btn { background: var(--main); border: none; color: white; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; }

        .page { display: none; }
        .page.active { display: block; }

        /* Modal Sharh */
        #detail-modal { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; overflow-y: auto; }
        .close-btn { position: fixed; top: 15px; left: 15px; background: #333; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2100; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 1000; }
        .nav-item { text-align: center; color: #888; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--main); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }

        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; background: #333; border: none; color: white; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 20px; color: var(--main);">PEKIN TOVAR</div>
</header>

<div class="categories" id="catBar">
    <div class="cat-item active" onclick="filterCat('Hammasi', this)">Hammasi</div>
</div>

<div class="container">
    <div id="home-page" class="page active">
        <div class="grid" id="mainGrid"></div>
    </div>

    <div id="wish-page" class="page">
        <h2 style="text-align: center;">Kerakli Mahsulotlar</h2>
        <p style="font-size: 13px; color: #ccc; text-align: center;">Sizga qanday mahsulot kerakligini yozing, biz topib keltiramiz!</p>
        <div style="background: #222; padding: 15px; border-radius: 15px;">
            <input type="text" id="reqPhone" placeholder="Telefon raqamingiz">
            <textarea id="reqText" placeholder="Mahsulot nomi yoki tarifi..." rows="4"></textarea>
            <button onclick="sendRequest()" style="width:100%; background:var(--main); border:none; color:white; padding:15px; border-radius:10px; font-weight:bold;">Adminga yuborish</button>
        </div>
    </div>

    <div id="cart-page" class="page">
        <h3>Sizning savatingiz</h3>
        <div id="cartItems"></div>
        <h4 id="cartTotal">Jami: 0 so'm</h4>
        <button onclick="checkout()" style="width:100%; background:var(--main); color:white; border:none; padding:15px; border-radius:10px;">Buyurtma berish</button>
    </div>
</div>

<div id="detail-modal">
    <div class="close-btn" onclick="closeDetail()"><i class="fa fa-arrow-left"></i></div>
    <div id="detailBody"></div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="showPage('home-page', this)"><i class="fa-solid fa-house"></i>Asosiy</div>
    <div class="nav-item" onclick="showPage('wish-page', this)"><i class="fa-solid fa-lightbulb"></i>Kerakli</div>
    <div class="nav-item" onclick="showPage('cart-page', this)"><i class="fa-solid fa-bag-shopping"></i>Savat</div>
    <div class="nav-item" onclick="goToAdmin()"><i class="fa-solid fa-user-shield"></i>Admin</div>
</nav>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let allProducts = {};
    let currentCat = "Hammasi";
    let cart = [];

    // Ma'lumotlarni yuklash
    db.ref('categories').on('value', s => {
        const bar = document.getElementById('catBar');
        bar.innerHTML = '<div class="cat-item active" onclick="filterCat(\'Hammasi\', this)">Hammasi</div>';
        s.forEach(c => {
            const name = c.val().name;
            bar.innerHTML += `<div class="cat-item" onclick="filterCat('${name}', this)">${name}</div>`;
        });
    });

    db.ref('products').on('value', s => {
        allProducts = s.val() || {};
        renderProducts();
    });

    function renderProducts() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        Object.keys(allProducts).forEach(id => {
            const p = allProducts[id];
            if(currentCat === "Hammasi" || p.category === currentCat) {
                grid.innerHTML += `
                <div class="card" onclick="openDetail('${id}')">
                    <img src="${p.images ? p.images[0] : ''}">
                    <div class="card-info">
                        <div class="p-name">${p.name}</div>
                        <div class="p-price">${parseInt(p.price).toLocaleString()} so'm</div>
                        <button class="add-btn" onclick="event.stopPropagation(); addToCart('${id}')">Savatga</button>
                    </div>
                </div>`;
            }
        });
    }

    function filterCat(name, el) {
        currentCat = name;
        document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        renderProducts();
    }

    function openDetail(id) {
        const p = allProducts[id];
        const modal = document.getElementById('detail-modal');
        modal.style.display = 'block';
        let imgs = p.images ? p.images.map(i => `<img src="${i}" style="width:100%">`).join('') : '';
        document.getElementById('detailBody').innerHTML = `
            ${imgs}
            <div style="padding:20px;">
                <h1>${p.name}</h1>
                <h3 style="color:var(--main)">${parseInt(p.price).toLocaleString()} so'm</h3>
                <p style="color:#aaa; line-height:1.6;">${p.desc || "Sharh mavjud emas."}</p>
                <button onclick="addToCart('${id}')" style="width:100%; background:var(--main); color:white; border:none; padding:18px; border-radius:12px; font-weight:bold;">Savatga qo'shish</button>
            </div>`;
    }

    function closeDetail() { document.getElementById('detail-modal').style.display = 'none'; }

    function sendRequest() {
        const phone = document.getElementById('reqPhone').value;
        const text = document.getElementById('reqText').value;
        if(!phone || !text) return alert("Iltimos to'ldiring!");
        db.ref('customer_requests').push({ phone, text });
        alert("Sizning istagingiz adminga yuborildi! ✅");
        document.getElementById('reqPhone').value = '';
        document.getElementById('reqText').value = '';
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function addToCart(id) {
        cart.push(allProducts[id]);
        alert("Savatga qo'shildi!");
        updateCart();
    }

    function updateCart() {
        const div = document.getElementById('cartItems');
        let total = 0;
        div.innerHTML = '';
        cart.forEach(i => {
            total += parseInt(i.price);
            div.innerHTML += `<div style="padding:10px; border-bottom:1px solid #333;">${i.name} - ${i.price} so'm</div>`;
        });
        document.getElementById('cartTotal').innerText = `Jami: ${total.toLocaleString()} so'm`;
    }

    function checkout() {
        let msg = "Yangi Buyurtma:\n";
        cart.forEach(i => msg += `- ${i.name} (${i.price} so'm)\n`);
        window.open(`https://t.me/Jahongir3616?text=${encodeURIComponent(msg)}`);
    }

    function goToAdmin() {
        if(prompt("Parol:") === "7777") window.location.href = "admin.html";
    }
</script>
</body>
</html>
