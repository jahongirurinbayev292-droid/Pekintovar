<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor - Online Shop</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --pink: #ff4d6d; --bg-pink: #fff0f3; }
        body { font-family: 'Arial', sans-serif; background: var(--bg-pink); margin: 0; padding-top: 60px; }
        
        /* Yuqori Menyu */
        header { 
            position: fixed; top: 0; width: 100%; background: var(--pink); 
            color: white; display: flex; justify-content: space-between; 
            align-items: center; padding: 10px 15px; box-sizing: border-box; z-index: 1000;
        }
        .logo { font-weight: bold; font-size: 18px; }
        .top-icons i { margin-left: 15px; cursor: pointer; font-size: 20px; }

        /* Grid (3 talik) */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; }
        .card { background: white; border-radius: 5px; overflow: hidden; position: relative; cursor: pointer; }
        .card img { width: 100%; height: 100px; object-fit: cover; }
        .price { font-size: 11px; font-weight: bold; color: var(--pink); text-align: center; padding: 5px; }

        /* Modal / Oyna */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .m-box { background: white; width: 90%; border-radius: 10px; padding: 20px; position: relative; text-align: center; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 25px; color: var(--pink); }

        /* Tugmalar */
        .btn { background: var(--pink); color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        
        /* Sahifalar */
        .page { display: none; padding: 15px; }
        .active { display: block; }
    </style>
</head>
<body>

    <header>
        <div class="logo">PEKIN TAVOR</div>
        <div class="top-icons">
            <i class="fa-solid fa-cart-shopping" onclick="showPage('cart')"></i>
            <i class="fa-solid fa-list" onclick="showPage('extra')"></i>
            <i class="fa-solid fa-gear" onclick="checkAdmin()"></i>
        </div>
    </header>

    <div id="home" class="page active">
        <div class="grid" id="list"></div>
    </div>

    <div id="cart" class="page">
        <h2 style="color: var(--pink);">Savat</h2>
        <div id="cart-items">Savat bo'sh</div>
        <button class="btn" onclick="sendOrder()">Buyurtma berish (Telegram)</button>
        <button class="btn" style="background:gray;" onclick="showPage('home')">Orqaga</button>
    </div>

    <div id="extra" class="page">
        <h2 style="color: var(--pink);">Kerakli narsalar</h2>
        <p>1. Oyoq kiyim tozalagichlar</p>
        <p>2. Maxsus paypoqlar</p>
        <button class="btn" onclick="showPage('home')">Orqaga</button>
    </div>

    <div id="modal" class="modal">
        <div class="m-box">
            <span class="close" onclick="closeM()">&times;</span>
            <img id="m-img" style="width:100%; border-radius:5px;">
            <h3 id="m-price" style="color:var(--pink);"></h3>
            <p id="m-desc"></p>
            <button class="btn" onclick="addToCart()">Savatga qo'shish</button>
        </div>
    </div>

    <script>
        // 1. Firebase ulanishi
        const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let currentItem = {};
        let cart = [];

        // 2. Mahsulotlarni chiqarish
        db.ref('products').on('value', (snap) => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            const data = snap.val();
            if(data) {
                Object.keys(data).reverse().forEach(id => {
                    const p = data[id];
                    list.innerHTML += `
                        <div class="card" onclick="openM('${p.images[0]}', '${p.price}', '${p.size}', '${p.age}')">
                            <img src="${p.images[0]}">
                            <div class="price">${p.price} so'm</div>
                        </div>`;
                });
            }
        });

        // 3. Funksiyalar
        function openM(img, price, size, age) {
            currentItem = { img, price, size, age };
            document.getElementById('m-img').src = img;
            document.getElementById('m-price').innerText = price + " so'm";
            document.getElementById('m-desc').innerText = "O'lcham: " + size + " | Yosh: " + age;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeM() { document.getElementById('modal').style.display = 'none'; }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function checkAdmin() {
            let pass = prompt("Sozlamalar uchun parolni kiriting:");
            if(pass === "7777") {
                window.location.href = "admin.html";
            } else {
                alert("Parol xato!");
            }
        }

        function addToCart() {
            cart.push(currentItem);
            alert("Savatga qo'shildi!");
            updateCart();
            closeM();
        }

        function updateCart() {
            const cDiv = document.getElementById('cart-items');
            if(cart.length == 0) { cDiv.innerText = "Savat bo'sh"; return; }
            cDiv.innerHTML = cart.map(i => `<p>${i.price} so'm - Pekin Tavor</p>`).join('');
        }

        function sendOrder() {
            if(cart.length == 0) return alert("Savat bo'sh!");
            let text = "Yangi Buyurtma:%0A";
            cart.forEach(i => text += `- Narxi: ${i.price}%0A`);
            // Sening nikiga yo'naltirish
            window.location.href = `https://t.me/Janahra?text=${text}`;
        }
    </script>
</body>
</html>
