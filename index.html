<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4; color: #333; }
        
        /* HEADER - Admin, Savat, Istaklar tepada */
        header {
            background: #fff; padding: 10px 5%; display: flex; 
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-weight: bold; font-size: 20px; color: #000; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a, .nav-links span { cursor: pointer; text-decoration: none; color: #333; font-size: 14px; }
        .badge { background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; position: absolute; margin-top: -10px; }

        /* KATEGORIYA MENYUSI */
        .categories { text-align: center; padding: 15px; background: #fff; }
        .categories button { 
            padding: 8px 15px; margin: 0 5px; border: 1px solid #ccc; 
            background: #fff; cursor: pointer; border-radius: 4px; 
        }
        .categories button:hover { background: #eee; }

        /* 3 QATORLI GRID (Kichik mahsulotlar) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* ANIQLIK */
            gap: 15px; padding: 20px 5%;
            max-width: 1000px; margin: 0 auto;
        }

        /* MAHSULOT KARTASI (IXCHAM) */
        .card {
            background: #fff; border: 1px solid #ddd; border-radius: 8px; 
            overflow: hidden; text-align: center; padding-bottom: 10px;
            transition: 0.2s; position: relative;
        }
        .card img { width: 100%; height: 180px; object-fit: cover; } /* Rasm kichikroq */
        .card h4 { margin: 10px 0 5px; font-size: 14px; padding: 0 5px; }
        .price { color: #d32f2f; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        
        /* SAVATGA QO'SHISH TUGMASI */
        .add-btn {
            background: #28a745; color: white; border: none; 
            padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .add-btn:active { transform: scale(0.95); background: #218838; }

        /* ISTAKLAR (YURAKCHA) */
        .wish { position: absolute; top: 10px; right: 10px; font-size: 20px; color: #ccc; cursor: pointer; }
        .wish.active { color: red; }

        /* MOBILE */
        @media (max-width: 768px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR</div>
    <div class="nav-links">
        <a href="admin.html">⚙️ Admin</a>
        <span onclick="alert('Istaklar ro\'yxati')">❤️ Istaklar <b id="w_count" class="badge">0</b></span>
        <span onclick="alert('Savat ochildi')">🛒 Savat <b id="c_count" class="badge">0</b></span>
    </div>
</header>

<div class="categories">
    <button onclick="load('Hammasi')">Hammasi</button>
    <button onclick="load('Erkaklar')">Erkaklar</button>
    <button onclick="load('Ayollar')">Ayollar</button>
    <button onclick="load('Bolalar')">Bolalar</button>
</div>

<div class="product-grid" id="main_box"></div>

<script>
    // Firebase Config
    const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(config);
    const db = firebase.database();

    let c = 0; let w = 0;

    function load(cat) {
        const box = document.getElementById('main_box');
        box.innerHTML = "Yuklanmoqda...";
        
        let ref = db.ref('products');
        if (cat !== 'Hammasi') ref = ref.orderByChild('category').equalTo(cat);

        ref.on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return box.innerHTML = "Mahsulot topilmadi.";

            Object.values(data).reverse().forEach(p => {
                box.innerHTML += `
                    <div class="card">
                        <span class="wish" onclick="this.classList.toggle('active'); w++; document.getElementById('w_count').innerText=w;">❤</span>
                        <img src="${p.images[0]}">
                        <h4>${p.name}</h4>
                        <div class="price">${p.price.toLocaleString()} so'm</div>
                        <button class="add-btn" onclick="c++; document.getElementById('c_count').innerText=c; this.innerText='Qo\'shildi ✅'">Savatga qo'shish</button>
                    </div>
                `;
            });
        });
    }
    load('Hammasi');
</script>

</body>
</html>
