<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor - Shop</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #ff0055; --bg: #1a0005; --card: #2d000f; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-top: 110px; }
        
        /* Fixed Header */
        header { position: fixed; top:0; width:100%; background: var(--p); padding: 10px 15px; display: flex; justify-content: space-between; z-index: 1000; box-sizing: border-box; }
        
        /* 307-rasmdagi kabi pushti menyular */
        .category-scroll { 
            position: fixed; top: 45px; width: 100%; background: #000; 
            overflow-x: auto; white-space: nowrap; padding: 10px; 
            z-index: 999; border-bottom: 1px solid var(--p);
        }
        .cat-btn { 
            display: inline-block; background: var(--p); color: white; 
            padding: 6px 15px; border-radius: 20px; margin-right: 8px; 
            font-size: 13px; font-weight: bold; cursor: pointer; border: none;
        }

        /* 3 qatorli grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px; }
        .card { background: var(--card); border: 1px solid var(--p); border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; height: 100px; object-fit: cover; }
        .p-price { font-size: 10px; text-align: center; color: var(--p); padding: 5px; font-weight: bold; }

        /* Admin va Savat bo'limlari uchun sodda dizayn */
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .btn-full { background: var(--p); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; margin-top: 10px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--p); background: #3d0015; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <b onclick="location.reload()">PEKIN TAVOR</b>
        <div>
            <i class="fa-solid fa-cart-shopping" onclick="showPage('cart')" style="margin-right:15px;"></i>
            <i class="fa-solid fa-gear" onclick="checkAdmin()"></i>
        </div>
    </header>

    <div class="category-scroll" id="cat-list">
        <button class="cat-btn" onclick="filterProducts('all')">Hammasi</button>
        </div>

    <div id="home" class="page active">
        <div class="grid" id="product-container"></div>
    </div>

    <div id="cart" class="page">
        <h2>Savat</h2>
        <div id="cart-items">Savat bo'sh</div>
        <button class="btn-full" onclick="orderToTelegram()">@Jahongir3616 ga buyurtma berish</button>
    </div>

    <div id="admin" class="page">
        <div style="background:#2d0033; padding:15px; border-radius:15px; border:1px solid var(--p);">
            <h3>📂 Menyularni Boshqarish</h3>
            <div style="display:flex; gap:5px;">
                <input type="text" id="cat-input" placeholder="Yangi bo'lim nomi">
                <button onclick="saveCategory()" style="background:var(--p); border:none; color:white; border-radius:8px;">+</button>
            </div>
            <hr>
            <h3>📤 Mahsulot Yuklash</h3>
            <input type="text" id="p-name" placeholder="Nomi">
            <input type="text" id="p-price" placeholder="Narxi">
            <input type="text" id="p-size" placeholder="O'lchami">
            <input type="text" id="p-img" placeholder="Rasm URL">
            <select id="p-cat" style="width:100%; padding:10px; background:#3d0015; color:white; border:1px solid var(--p); border-radius:10px;">
                <option value="all">Kategoriyani tanlang</option>
            </select>
            <button class="btn-full" onclick="saveProduct()">Saytga qo'shish</button>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();
        let cart = [];

        // 1. Kategoriyalarni yuklash
        db.ref('categories').on('value', s => {
            const list = document.getElementById('cat-list');
            const select = document.getElementById('p-cat');
            list.innerHTML = `<button class="cat-btn" onclick="filterProducts('all')">Hammasi</button>`;
            select.innerHTML = `<option value="all">Kategoriyani tanlang</option>`;
            
            if(s.val()) {
                Object.values(s.val()).forEach(v => {
                    list.innerHTML += `<button class="cat-btn" onclick="filterProducts('${v}')">${v}</button>`;
                    select.innerHTML += `<option value="${v}">${v}</option>`;
                });
            }
        });

        // 2. Mahsulotlarni yuklash va filtrlash
        function filterProducts(catName) {
            db.ref('products').once('value', s => {
                const container = document.getElementById('product-container');
                container.innerHTML = "";
                if(s.val()) {
                    Object.values(s.val()).forEach(p => {
                        if(catName === 'all' || p.category === catName) {
                            container.innerHTML += `
                                <div class="card" onclick="addToCart('${p.image}', '${p.price}', '${p.name}')">
                                    <img src="${p.image}">
                                    <div class="p-price">${p.price} so'm</div>
                                </div>`;
                        }
                    });
                }
            });
            showPage('home');
        }
        filterProducts('all');

        // 3. Admin funksiyalari
        function checkAdmin() { if(prompt("Kod?") === "7777") showPage('admin'); }
        
        function saveCategory() {
            const val = document.getElementById('cat-input').value;
            if(val) { db.ref('categories').push(val); document.getElementById('cat-input').value = ""; }
        }

        function saveProduct() {
            const data = {
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                size: document.getElementById('p-size').value,
                image: document.getElementById('p-img').value,
                category: document.getElementById('p-cat').value
            };
            db.ref('products').push(data);
            alert("Qo'shildi!");
            showPage('home');
        }

        // 4. Savat va Telegram
        function addToCart(img, price, name) {
            cart.push({img, price, name});
            alert("Savatga qo'shildi!");
            document.getElementById('cart-items').innerHTML = cart.map(i => `<p>✅ ${i.name} - ${i.price} so'm</p>`).join('');
        }

        function orderToTelegram() {
            let msg = "BUYURTMA:%0A";
            cart.forEach(i => msg += `- ${i.name}: ${i.price}%0A🖼 Rasm: ${i.img}%0A%0A`);
            window.location.href = `https://t.me/Jahongir3616?text=${msg}`;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
