<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Yangi Mahsulot</h2>
    <input type="text" id="pName" placeholder="Mahsulot nomi">
    <input type="text" id="pPrice" placeholder="Narxi (masalan: 50 000)">
    <input type="file" id="pImage" accept="image/*">
    <button id="saveBtn" onclick="saveData()">Saqlash</button>
    <div id="status"></div>
</div>

<script>
    // 1. FIREBASE SOZLAMALARI
    const firebaseConfig = {
        databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. YANGI TEKIN RASM KALITI (ImgBB)
    const API_KEY = "6901809088663806a66699119934220c"; 

    async function saveData() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const file = document.getElementById('pImage').files[0];
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');

        if (!name || !price || !file) {
            alert("Iltimos, hamma ma'lumotni to'ldiring!");
            return;
        }

        btn.disabled = true;
        status.innerHTML = "⌛ Yuklanmoqda...";
        status.style.color = "orange";

        try {
            // Rasmni tekin serverga yuklash
            const formData = new FormData();
            formData.append("image", file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                const imageUrl = result.data.url;

                // Firebase-ga yozish
                await db.ref('products').push({
                    name: name,
                    price: price,
                    image: imageUrl
                });

                status.innerHTML = "✅ Muvaffaqiyatli saqlandi!";
                status.style.color = "green";
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImage').value = '';
            } else {
                throw new Error("Rasm yuklanmadi");
            }
        } catch (error) {
            status.innerHTML = "❌ Xatolik: " + error.message;
            status.style.color = "red";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
