<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tovar - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .admin-card { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #ccc; }
        #status { text-align: center; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Yangi Mahsulot</h2>
    <input type="text" id="pName" placeholder="Mahsulot nomi">
    <input type="text" id="pPrice" placeholder="Narxi (masalan: 150 000)">
    
    <p style="font-size: 12px; color: #888; margin-bottom: 2px;">Rasm tanlang:</p>
    <input type="file" id="pImageFile" accept="image/*">
    
    <button id="saveBtn" onclick="uploadAndSave()">Saqlash</button>
    <p id="status"></p>
</div>

<script>
    // 1. FIREBASE SOZLAMALARI
    const firebaseConfig = {
        databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. IMGBB KALITI (Rasmlarni tekin saqlash uchun)
    const IMGBB_API_KEY = "6901809088663806a66699119934220c"; // Bu tekin kalit

    async function uploadAndSave() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const fileInput = document.getElementById('pImageFile');
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');

        if (!name || !price || !fileInput.files[0]) {
            alert("Hamma joyni to'ldiring va rasm tanlang!");
            return;
        }

        btn.disabled = true;
        status.innerText = "Rasm yuklanmoqda... (Kuting)";

        // Rasmni ImgBB ga yuklash
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        try {
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            const imageUrl = result.data.url;

            // Firebase Database ga saqlash
            await db.ref('products').push({
                name: name,
                price: price,
                image: imageUrl
            });

            status.innerText = "Muvaffaqiyatli saqlandi! ✅";
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            fileInput.value = '';
        } catch (error) {
            console.error(error);
            status.innerText = "Xatolik yuz berdi! ❌";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
