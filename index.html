<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026 | Premium Store</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #00f2fe;
            --main-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --card-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0f172a; /* To'q va zamonaviy fon */
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR & ADMIN */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .admin-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }

        /* CATEGORY MENU */
        .menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 30px 0;
        }

        .menu button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .menu button.active, .menu button:hover {
            background: var(--main-grad);
            color: #000;
            transform: translateY(-3px);
        }

        /* PRODUCT GRID (3 QATOR) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* ANIQ 3 QATOR */
            gap: 30px;
            padding: 0 5% 50px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* PRODUCT CARD */
        .card {
            background: #1e293b;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            transition: 0.4s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: var(--card-shadow);
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .info { padding: 20px; }
        .price {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            margin: 10px 0;
        }

        /* SAVATGA QO'SHISH EFFEKTI (NEON GLOW) */
        .buy-btn {
            width: 100%;
            padding: 15px;
            border: none;
            background: var(--main-grad);
            color: #000;
            font-weight: 800;
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .buy-btn:active {
            transform: scale(0.9);
        }

        /* CART ICON */
        .cart-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--main-grad);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 30px rgba(0,242,254,0.4);
            cursor: pointer;
            z-index: 1001;
        }

        .count {
            position: absolute;
            top: 0;
            right: 0;
            background: white;
            color: black;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* MOBILE OPTIMIZATSIYA (Telefonda 1 qator bo'lib qolmasligi uchun) */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-size: 24px; font-weight: 900; letter-spacing: 2px;">PEKIN TAVOR <span style="color:var(--accent)">2026</span></div>
        <a href="admin.html" class="admin-btn">⚙️ ADMIN PANELI</a>
    </nav>

    <div class="menu">
        <button onclick="load('Hammasi')" class="active">BARCHASI</button>
        <button onclick="load('Erkaklar')">ERKAKLAR</button>
        <button onclick="load('Ayollar')">AYOLLAR</button>
        <button onclick="load('Bolalar')">BOLALAR</button>
    </div>

    <div class="grid" id="container"></div>

    <div class="cart-float">
        🛒 <div class="count" id="c_count">0</div>
    </div>

    <script>
        // FIREBASE SOZLAMALARI
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let cartCount = 0;

        function load(category) {
            const box = document.getElementById('container');
            box.innerHTML = "<h2 style='grid-column: 1/4; text-align:center;'>Yuklanmoqda...</h2>";
            
            let ref = db.ref('products');
            if (category !== 'Hammasi') {
                ref = ref.orderByChild('category').equalTo(category);
            }

            ref.on('value', (snap) => {
                box.innerHTML = "";
                const data = snap.val();
                if (!data) return box.innerHTML = "<h2 style='grid-column: 1/4; text-align:center;'>Hozircha mahsulot yo'q</h2>";

                Object.values(data).reverse().forEach(p => {
                    box.innerHTML += `
                        <div class="card">
                            <img src="${p.images[0]}" alt="Kiyim">
                            <div class="info">
                                <small style="color:var(--accent)">${p.category}</small>
                                <h3 style="margin:5px 0;">${p.name}</h3>
                                <div class="price">${p.price.toLocaleString()} SO'M</div>
                                <button class="buy-btn" onclick="addToCart(this)">Savatga qo'shish</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // SAVATGA QO'SHISH EFFEKTI (GLOW SPLASH)
        function addToCart(btn) {
            cartCount++;
            document.getElementById('c_count').innerText = cartCount;

            // Tugma effekti
            btn.style.background = "white";
            btn.innerText = "QO'SHILDI ✅";
            
            setTimeout(() => {
                btn.style.background = "";
                btn.innerText = "SAVATGA QO'SHISH";
            }, 1000);

            // Portlash effekti (Visual feedback)
            const splash = document.createElement('div');
            splash.style.position = 'fixed';
            splash.style.top = '50%';
            splash.style.left = '50%';
            splash.style.transform = 'translate(-50%, -50%)';
            splash.style.width = '0px';
            splash.style.height = '0px';
            splash.style.boxShadow = '0 0 100px 50px rgba(0, 242, 254, 0.3)';
            splash.style.borderRadius = '50%';
            splash.style.transition = '0.5s';
            splash.style.zIndex = '2000';
            document.body.appendChild(splash);

            setTimeout(() => {
                splash.style.width = '500px';
                splash.style.height = '500px';
                splash.style.opacity = '0';
            }, 10);
            
            setTimeout(() => splash.remove(), 500);
        }

        load('Hammasi');
    </script>
</body>
</html>
