<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>PEKIN TAVOR | ADMIN</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background:#0a0a1a; color:white; font-family:sans-serif; padding:20px; }
        .box { background:#16162d; padding:20px; border-radius:15px; border-left: 5px solid #ff00aa; margin-bottom:20px; }
        h2, h3 { color:#ff00aa; }
        .stats { display:flex; gap:10px; margin-bottom:20px; }
        .st-card { background:#1f1f3d; padding:15px; border-radius:10px; flex:1; text-align:center; border:1px solid #333; }
        input { width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#000; color:white; border:1px solid #444; box-sizing:border-box;}
        .btn { background:#ff00aa; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; }
        .item { display:flex; align-items:center; background:#1f1f3d; padding:10px; margin-top:10px; border-radius:10px; gap:15px; border:1px solid #333; }
        .item img { width:55px; height:55px; border-radius:8px; object-fit:cover; border:1px solid #ff00aa; }
        .del { color:#ff4444; cursor:pointer; font-weight:bold; margin-left:auto; }
        .edit { color:#44aaff; cursor:pointer; font-weight:bold; margin-right:15px; }
    </style>
</head>
<body>
    <h2>🚀 BOSHQARUV PANELI</h2>
    <div class="stats">
        <div class="st-card"><h2 id="p_count">0</h2><p>Mahsulotlar</p></div>
        <div class="st-card"><h2 id="c_count">0</h2><p>Bo'limlar</p></div>
    </div>

    <div class="box">
        <h3>📂 Bo'limlar Boshqaruvi</h3>
        <input type="text" id="cat_in" placeholder="Yangi bo'lim nomi...">
        <button class="btn" onclick="addCat()">Bo'lim Qo'shish</button>
        <div id="cat_list" style="margin-top:15px;"></div>
    </div>

    <div class="box">
        <h3>📦 Mahsulotlarni Tahrirlash</h3>
        <div id="prod_list"></div>
    </div>

    <div class="box">
        <h3>💬 Kelgan Istaklar</h3>
        <div id="wish_list"></div>
    </div>

    <script>
        const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        function addCat() {
            let v = document.getElementById('cat_in').value;
            if(v) { db.ref('categories').push(v); document.getElementById('cat_in').value=""; }
        }

        db.ref('categories').on('value', s => {
            const l = document.getElementById('cat_list'); l.innerHTML = "";
            let c = 0; if(s.val()) Object.entries(s.val()).forEach(([k,v]) => {
                c++; l.innerHTML += `<span style="background:#ff00aa; padding:5px 12px; border-radius:20px; margin:5px; display:inline-block;">${v} <b onclick="db.ref('categories').child('${k}').remove()" style="cursor:pointer">×</b></span>`;
            });
            document.getElementById('c_count').innerText = c;
        });

        db.ref('products').on('value', s => {
            const l = document.getElementById('prod_list'); l.innerHTML = "";
            let c = 0; if(s.val()) Object.entries(s.val()).forEach(([k,p]) => {
                c++; l.innerHTML += `
                <div class="item">
                    <img src="${p.img}">
                    <div><b>${p.name}</b><br><small>${p.price} so'm</small></div>
                    <span class="edit" onclick="editP('${k}','${p.name}','${p.price}')">✏️</span>
                    <span class="del" onclick="db.ref('products').child('${k}').remove()">🗑</span>
                </div>`;
            });
            document.getElementById('p_count').innerText = c;
        });

        function editP(k,n,p) {
            let nn = prompt("Yangi nom:", n); let np = prompt("Yangi narx:", p);
            if(nn && np) db.ref('products').child(k).update({name:nn, price:np});
        }

        db.ref('wishes').on('value', s => {
            const l = document.getElementById('wish_list'); l.innerHTML = "";
            if(s.val()) Object.entries(s.val()).forEach(([k,w]) => {
                l.innerHTML += `<div class="item" style="display:block"><b>${w.time}</b>: ${w.msg} <br><small onclick="db.ref('wishes').child('${k}').remove()" style="color:red; cursor:pointer">O'chirish</small></div>`;
            });
        });
    </script>
</body>
</html>
