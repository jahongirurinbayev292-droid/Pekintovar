<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #ff00aa; --bg: #0f0c29; --card: #1b1b3a; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--accent); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--accent); background: #24244e; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; background: var(--accent); color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .prod-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .prod-item img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; margin-right: 15px; }
    </style>
</head>
<body>

    <h2>Admin Panel</h2>

    <div class="card">
        <h3>1. Menyularni Boshqarish</h3>
        <input type="text" id="c-name" placeholder="Yangi menyu nomi">
        <button class="btn" onclick="addC()">Qo'shish</button>
        <div id="c-list" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
    </div>

    <div class="card">
        <h3>2. Mahsulot Qo'shish</h3>
        <input type="text" id="p-name" placeholder="Mahsulot nomi">
        <input type="number" id="p-price" placeholder="Narxi">
        <input type="text" id="p-img" placeholder="Rasm URL linki">
        <select id="p-cat"></select>
        <button class="btn" onclick="addP()">SAYTGA CHIQARISH</button>
    </div>

    <div class="card">
        <h3>3. Mahsulotlarni Menyulash (Hamma mahsulotlar)</h3>
        <div id="p-list"></div>
    </div>

    <script>
        const config = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        function addC() {
            const v = document.getElementById('c-name').value;
            if(v) db.ref('categories').push(v);
        }

        db.ref('categories').on('value', s => {
            const list = document.getElementById('c-list');
            const sel = document.getElementById('p-cat');
            list.innerHTML = ""; sel.innerHTML = "<option>Bo'limni tanlang</option>";
            if(s.val()) Object.entries(s.val()).forEach(([key, name]) => {
                list.innerHTML += `<span style="background:var(--accent); padding:5px; border-radius:5px; font-size:12px;">${name} <i class="fa fa-times" onclick="db.ref('categories').child('${key}').remove()"></i></span>`;
                sel.innerHTML += `<option value="${name}">${name}</option>`;
            });
        });

        function addP() {
            const d = {
                name: document.getElementById('p-name').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                cat: document.getElementById('p-cat').value
            };
            if(d.name && d.img) {
                db.ref('products').push(d);
                alert("Qo'shildi!");
            }
        }

        db.ref('products').on('value', s => {
            const list = document.getElementById('p-list');
            list.innerHTML = "";
            if(s.val()) Object.entries(s.val()).forEach(([key, p]) => {
                list.innerHTML += `
                    <div class="prod-item">
                        <img src="${p.img}">
                        <div style="flex-grow:1"><b>${p.name}</b><br><small>${p.cat}</small></div>
                        <i class="fa fa-trash" style="color:red" onclick="db.ref('products').child('${key}').remove()"></i>
                    </div>`;
            });
        });
    </script>
</body>
</html>
