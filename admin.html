<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Pekin Tavor</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #f806cc; --bg: #0f0c29; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 20px; }
        .card { background: #1b1b3a; padding: 20px; border-radius: 15px; border: 1px solid var(--accent); margin-bottom: 20px; }
        h2 { color: var(--accent); font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #24244e; border: 1px solid var(--accent); color: #fff; border-radius: 8px; outline: none; }
        .btn { width: 100%; background: #00ffab; color: #000; padding: 15px; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.8; }
        .prod-item { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
        .prod-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; margin-right: 15px; }
        .menu-badge { background: var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 12px; margin: 5px; display: inline-flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2><i class="fas fa-folder-plus"></i> 1. Menyularni Boshqarish</h2>
    <div style="display:flex; gap:10px;">
        <input type="text" id="new-cat" placeholder="Yangi bo'lim nomi (masalan: Sport)">
        <button onclick="addMenu()" style="background:var(--accent); color:white; border:none; padding:0 20px; border-radius:8px; cursor:pointer;">Qo'shish</button>
    </div>
    <div id="menu-list" style="margin-top:15px;"></div>
</div>

<div class="card">
    <h2><i class="fas fa-upload"></i> 2. Mahsulot Yuklash</h2>
    <input type="text" id="p-name" placeholder="Mahsulot nomi">
    <input type="number" id="p-price" placeholder="Narxi (faqat son)">
    <input type="text" id="p-size" placeholder="O'lchamlari (masalan: 38-44)">
    <input type="text" id="p-age" placeholder="Yosh chegarasi (masalan: 5-12 yosh)">
    <select id="p-cat-select"></select>
    <label style="font-size:12px; color:#00ffab;">Rasm tanlang:</label>
    <input type="file" id="p-file" accept="image/*">
    <button class="btn" onclick="saveProduct()">BAZAGA SAQLASH</button>
</div>

<div class="card">
    <h2><i class="fas fa-th-list"></i> 3. Barcha Mahsulotlar</h2>
    <div id="all-products"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Menyularni boshqarish
    function addMenu() {
        const name = document.getElementById('new-cat').value;
        if(name) db.ref('categories').push({name}).then(() => {
            document.getElementById('new-cat').value = "";
        });
    }

    db.ref('categories').on('value', snap => {
        const list = document.getElementById('menu-list');
        const select = document.getElementById('p-cat-select');
        list.innerHTML = ""; select.innerHTML = "";
        const data = snap.val();
        if(data) Object.keys(data).forEach(id => {
            list.innerHTML += `<span class="menu-badge">${data[id].name} <i class="fas fa-times" onclick="db.ref('categories/${id}').remove()" style="cursor:pointer"></i></span>`;
            select.innerHTML += `<option value="${data[id].name}">${data[id].name}</option>`;
        });
    });

    // Rasm va ma'lumotlarni saqlash
    async function saveProduct() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const file = document.getElementById('p-file').files[0];
        const cat = document.getElementById('p-cat-select').value;

        if(!name || !price || !file) return alert("Barcha maydonlarni to'ldiring!");

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
            db.ref('products').push({
                name: name,
                price: price,
                size: document.getElementById('p-size').value || "-",
                age: document.getElementById('p-age').value || "-",
                category: cat,
                images: [reader.result],
                time: Date.now()
            }).then(() => {
                alert("Muvaffaqiyatli qo'shildi!");
                document.getElementById('p-name').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-file').value = "";
            });
        };
    }

    // O'chirish va ko'rish
    db.ref('products').on('value', snap => {
        const box = document.getElementById('all-products');
        box.innerHTML = "";
        const data = snap.val();
        if(data) Object.keys(data).reverse().forEach(id => {
            const p = data[id];
            box.innerHTML += `<div class="prod-item">
                <img src="${p.images[0]}">
                <div style="flex:1"><b>${p.name}</b><br><small>${p.category} | ${p.price} so'm</small></div>
                <button onclick="db.ref('products/${id}').remove()" style="background:#ff4757; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    });
</script>
</body>
</html>
