<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | PEKIN TOVAR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            padding: 15px;
        }
        
        .container {
            max-width: 100%;
        }
        
        .header {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #ff1493;
            font-size: 18px;
        }
        
        .logout-btn {
            background: #ff1493;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .section h2 {
            color: #ff1493;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ff69b4;
            padding-bottom: 5px;
        }
        
        input, button {
            padding: 8px;
            margin: 4px;
            border-radius: 8px;
            border: 1px solid #ff69b4;
            width: calc(100% - 8px);
        }
        
        button {
            background: #ff1493;
            color: white;
            cursor: pointer;
            border: none;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ffe4ec;
        }
        
        th {
            background: #ff69b4;
            color: white;
        }
        
        .product-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 5px;
        }
        
        .form-group {
            margin-bottom: 8px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 3px;
            color: #ff1493;
            font-size: 12px;
            font-weight: bold;
        }
        
        .edit-btn {
            background: #ffa500;
            padding: 4px 8px;
            margin: 2px;
        }
        
        .delete-btn {
            background: #ff4040;
            padding: 4px 8px;
            margin: 2px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #ff1493;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌸 Admin Panel</h1>
        <button class="logout-btn" onclick="logout()">🚪 Chiqish</button>
    </div>
    
    <!-- Mahsulot qo'shish -->
    <div class="section">
        <h2>➕ Mahsulot qo'shish</h2>
        <div class="form-group">
            <label>Rasm URL</label>
            <input type="text" id="imgUrl" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>Mahsulot nomi</label>
            <input type="text" id="name" placeholder="Ko'ylak">
        </div>
        <div class="form-group">
            <label>Narx (so'm)</label>
            <input type="number" id="price" placeholder="380000">
        </div>
        <div class="form-group">
            <label>Razmer</label>
            <input type="text" id="size" placeholder="L">
        </div>
        <div class="form-group">
            <label>Yosh</label>
            <input type="text" id="age" placeholder="7">
        </div>
        <button onclick="addProduct()">✅ Qo'shish</button>
    </div>
    
    <!-- Mahsulotlar -->
    <div class="section">
        <h2>📦 Mahsulotlar</h2>
        <div id="productsTable">
            <div class="loading">⏳ Yuklanmoqda...</div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

// Mahsulotlarni yuklash
function loadProducts() {
    db.ref('products').on('value', (snap) => {
        const data = snap.val();
        const products = data ? Object.values(data) : [];
        
        if (products.length === 0) {
            document.getElementById('productsTable').innerHTML = '<div class="loading">📭 Mahsulot yo\'q</div>';
            return;
        }
        
        document.getElementById('productsTable').innerHTML = `
            <table>
                <thead><tr><th>Rasm</th><th>Nomi</th><th>Narx</th><th>Razmer</th><th>Yosh</th><th>Amallar</th></tr></thead>
                <tbody>
                    ${products.map(p => `
                        <tr>
                            <td><img class="product-img" src="${p.image_url}" onerror="this.src='https://placehold.co/40/ff69b4/white?text=?'"></td>
                            <td><b>${p.name}</b></td>
                            <td style="color:#ff1493;">${(p.price || 0).toLocaleString()} so'm</td>
                            <td>${p.size || '-'}</td>
                            <td>${p.age || '-'}</td>
                            <td>
                                <button class="edit-btn" onclick="editProduct('${p.id}')">✏️</button>
                                <button class="delete-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    });
}

// Mahsulot qo'shish
function addProduct() {
    const id = `prod_${Date.now()}`;
    const name = document.getElementById('name').value;
    const price = parseInt(document.getElementById('price').value);
    const size = document.getElementById('size').value;
    const age = document.getElementById('age').value;
    const image_url = document.getElementById('imgUrl').value || 'https://placehold.co/400x400/ff69b4/white?text=NO+IMAGE';
    
    if (!name || !price) {
        alert('Nomi va narxni kiriting!');
        return;
    }
    
    const product = {
        id: id,
        name: name,
        price: price,
        size: size,
        age: age,
        image_url: image_url,
        created_at: new Date().toISOString()
    };
    
    db.ref(`products/${id}`).set(product);
    alert('✅ Mahsulot qo\'shildi!');
    
    document.getElementById('name').value = '';
    document.getElementById('price').value = '';
    document.getElementById('size').value = '';
    document.getElementById('age').value = '';
    document.getElementById('imgUrl').value = '';
}

// Mahsulot tahrirlash
function editProduct(id) {
    db.ref(`products/${id}`).once('value', (snap) => {
        const p = snap.val();
        if (!p) return;
        
        const newName = prompt('Yangi nom:', p.name);
        const newPrice = prompt('Yangi narx:', p.price);
        if (newName && newPrice) {
            db.ref(`products/${id}`).update({
                name: newName,
                price: parseInt(newPrice)
            });
            alert('✅ Yangilandi!');
        }
    });
}

// Mahsulot o'chirish
function deleteProduct(id) {
    if (confirm('O\'chirilsinmi?')) {
        db.ref(`products/${id}`).remove();
        alert('✅ O\'chirildi!');
    }
}

function logout() {
    window.location.href = '/';
}

loadProducts();
</script>
</body>
</html>
