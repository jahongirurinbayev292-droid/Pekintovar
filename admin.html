<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Pekin Tavor</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #ff00aa; --bg: #0f0c29; --card: #1b1b3a; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 15px; }
        
        .admin-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--accent); margin-bottom: 20px; }
        h2 { color: var(--accent); font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--accent); background: #24244e; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; background: var(--accent); color: #fff; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Mahsulotlar ro'yxati dizayni */
        .product-list-container { margin-top: 20px; }
        .product-item { 
            display: flex; align-items: center; background: rgba(255,255,255,0.05); 
            padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--accent);
        }
        .product-item img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 15px; }
        .product-info { flex-grow: 1; }
        .product-info b { display: block; font-size: 14px; }
        .product-info span { font-size: 12px; color: var(--accent); }
        .del-btn { color: #ff4444; cursor: pointer; padding: 10px; font-size: 18px; }

        .menu-badge { background: var(--accent); padding: 4px 10px; border-radius: 15px; font-size: 11px; margin-left: 5px; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2><i class="fa-solid fa-folder-tree"></i> Menyularni Boshqarish</h2>
        <div style="display:flex; gap:10px;">
            <input type="text" id="new-menu-name" placeholder="Yangi menyu nomi">
            <button onclick="addMenu()" style="background:var(--accent); border:none; color:white; padding:0 15px; border-radius:10px; font-weight:bold;">+</button>
        </div>
        <div id="menu-display" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
    </div>

    <div class="admin-card">
        <h2><i class="fa-solid fa-cloud-arrow-up"></i> Mahsulot Yuklash</h2>
        <input type="text" id="p-title" placeholder="Mahsulot nomi">
        <input type="number" id="p-price" placeholder="Narxi (son)">
        <input type="text" id="p-img" placeholder="Rasm URL linki">
        <select id="p-category-select">
            <option value="">Bo'limni tanlang</option>
        </select>
        <button class="btn" onclick="uploadProduct()">SAYTGA CHIQARISH</button>
    </div>

    <div class="admin-card product-list-container">
        <h2><i class="fa-solid fa-boxes-stacked"></i> Hamma Mahsulotlar</h2>
        <div id="product-list">Yuklanmoqda...</div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Menyularni yuklash va qo'shish
        function addMenu() {
            const name = document.getElementById('new-menu-name').value;
            if(name) { db.ref('categories').push(name); document.getElementById('new-menu-name').value = ""; }
        }

        db.ref('categories').on('value', snap => {
            const display = document.getElementById('menu-display');
            const select = document.getElementById('p-category-select');
            display.innerHTML = "";
            select.innerHTML = `<option value="">Bo'limni tanlang</option>`;
            
            if(snap.val()) {
                Object.entries(snap.val()).forEach(([key, name]) => {
                    display.innerHTML += `<span class="menu-badge">${name} <i class="fa-solid fa-xmark" onclick="deleteMenu('${key}')" style="cursor:pointer;margin-left:5px"></i></span>`;
                    select.innerHTML += `<option value="${name}">${name}</option>`;
                });
            }
        });

        function deleteMenu(key) { if(confirm("Bo'limni o'chirmoqchimisiz?")) db.ref('categories').child(key).remove(); }

        // 2. Mahsulot yuklash
        function uploadProduct() {
            const data = {
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                img: document.getElementById('p-img').value,
                category: document.getElementById('p-category-select').value
            };
            if(data.title && data.price && data.category) {
                db.ref('products').push(data);
                alert("Mahsulot qo'shildi!");
                document.getElementById('p-title').value = "";
                document.getElementById('p-price').value = "";
                document.getElementById('p-img').value = "";
            } else {
                alert("Ma'lumotlarni to'liq kiriting!");
            }
        }

        // 3. Mahsulotlar ro'yxatini chiqarish (O'zing menyulashing uchun)
        db.ref('products').on('value', snap => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            if(snap.val()) {
                Object.entries(snap.val()).forEach(([key, p]) => {
                    list.innerHTML += `
                        <div class="product-item">
                            <img src="${p.img || 'https://via.placeholder.com/50'}">
                            <div class="product-info">
                                <b>${p.title}</b>
                                <span>${Number(p.price).toLocaleString()} so'm | <small>${p.category}</small></span>
                            </div>
                            <i class="fa-solid fa-trash-can del-btn" onclick="deleteProduct('${key}')"></i>
                        </div>`;
                });
            } else {
                list.innerHTML = "Mahsulotlar mavjud emas.";
            }
        });

        function deleteProduct(key) { if(confirm("Mahsulotni o'chirmoqchimisiz?")) db.ref('products').child(key).remove(); }
    </script>
</body>
</html>
