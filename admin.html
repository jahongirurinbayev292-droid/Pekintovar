<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | NEON MARKET</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:linear-gradient(135deg,#0a0a2a,#1a0033);color:#fff;padding:15px}
        .container{max-width:1200px;margin:0 auto}
        .header{background:rgba(191,64,255,0.2);padding:12px;border-radius:10px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
        .header h1{color:#bf40ff;font-size:18px}
        .logout-btn{background:#ff4040;color:white;border:none;padding:6px 15px;border-radius:20px;cursor:pointer}
        .section{background:rgba(255,255,255,0.1);border-radius:10px;padding:15px;margin-bottom:15px}
        .section h2{color:#bf40ff;font-size:16px;margin-bottom:10px;border-bottom:1px solid #bf40ff;padding-bottom:5px}
        input,button{padding:8px;margin:4px;border-radius:5px;border:none;width:calc(100% - 8px)}
        button{background:#bf40ff;color:white;cursor:pointer}
        table{width:100%;border-collapse:collapse;font-size:12px}
        th,td{padding:8px;text-align:left;border-bottom:1px solid rgba(191,64,255,0.3)}
        th{color:#bf40ff}
        .product-img{width:40px;height:40px;object-fit:cover;border-radius:5px}
        .form-group{margin-bottom:8px}
        .form-group label{display:block;margin-bottom:3px;color:#bf40ff;font-size:12px}
        .edit-btn,.delete-btn{padding:4px 8px;margin:2px;border:none;border-radius:4px;cursor:pointer}
        .edit-btn{background:#ffa500;color:white}
        .delete-btn{background:#ff4040;color:white}
        .loading{text-align:center;padding:20px;color:#bf40ff}
        .categories-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
        .category-card{background:rgba(191,64,255,0.2);padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
        .del-cat{background:#ff4040;color:white;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:10px}
        .add-form{display:flex;gap:8px;margin-top:10px}
        .add-form input{flex:1;background:rgba(0,0,0,0.5);color:white;border:1px solid #bf40ff}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>👑 Admin Panel</h1><button class="logout-btn" onclick="logout()">Chiqish</button></div>
    
    <div class="section"><h2>📁 Kategoriyalar</h2><div id="categoriesList" class="categories-grid"></div><div class="add-form"><input type="text" id="newCat" placeholder="Yangi kategoriya"><button onclick="addCategory()">Qo'shish</button></div></div>
    
    <div class="section"><h2>➕ Mahsulot qo'shish</h2>
        <div class="form-group"><label>Rasm URL</label><input type="text" id="imgUrl" placeholder="https://..."></div>
        <div class="form-group"><label>Nomi</label><input type="text" id="name" placeholder="Ko'ylak"></div>
        <div class="form-group"><label>Narx (so'm)</label><input type="number" id="price" placeholder="380000"></div>
        <div class="form-group"><label>Razmer</label><input type="text" id="size" placeholder="L"></div>
        <div class="form-group"><label>Yosh</label><input type="text" id="age" placeholder="7"></div>
        <div class="form-group"><label>Kategoriya</label><select id="category"></select></div>
        <button onclick="addProduct()">✅ Qo'shish</button>
    </div>
    
    <div class="section"><h2>📦 Mahsulotlar</h2><div id="productsTable"><div class="loading">⏳ Yuklanmoqda...</div></div></div>
</div>

<script>
let products = [];
let categories = ["Kiyimlar","Oyoq kiyimlar","Aksessuarlar"];

async function loadData(){
    try{
        let r=await fetch('/api/products');
        products=await r.json();
        let c=await fetch('/api/categories');
        let catData=await c.json();
        if(catData.length) categories=catData;
    }catch(e){
        let localP=localStorage.getItem('products');
        if(localP) products=JSON.parse(localP);
        let localC=localStorage.getItem('categories');
        if(localC) categories=JSON.parse(localC);
    }
    displayCategories();
    displayProducts();
}

function displayCategories(){
    let container=document.getElementById('categoriesList');
    container.innerHTML=categories.map(c=>`<div class="category-card">${c}<button class="del-cat" onclick="deleteCategory('${c}')">✖</button></div>`).join('');
    let select=document.getElementById('category');
    select.innerHTML=categories.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function addCategory(){
    let newCat=document.getElementById('newCat').value.trim();
    if(!newCat) return;
    categories.push(newCat);
    localStorage.setItem('categories',JSON.stringify(categories));
    displayCategories();
    document.getElementById('newCat').value='';
    try{fetch('/api/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({categories})});}catch(e){}
}

function deleteCategory(cat){
    if(!confirm(`"${cat}" o'chirilsinmi?`)) return;
    categories=categories.filter(c=>c!==cat);
    localStorage.setItem('categories',JSON.stringify(categories));
    displayCategories();
}

function displayProducts(){
    let container=document.getElementById('productsTable');
    if(products.length===0){container.innerHTML='<div class="loading">📭 Mahsulot yo\'q</div>';return;}
    container.innerHTML=`<table><thead><tr><th>Rasm</th><th>Nomi</th><th>Narx</th><th>Razmer</th><th>Yosh</th><th>Kategoriya</th><th>Amallar</th></tr></thead><tbody>${products.map(p=>`<tr><td><img class="product-img" src="${p.image_url}" onerror="this.src='https://placehold.co/40/bf40ff/white?text=?'"></td><td><b>${p.name}</b></td><td style="color:#bf40ff;">${(p.price||0).toLocaleString()} so'm</td><td>${p.size||'-'}</td><td>${p.age||'-'}</td><td>${p.category||'-'}</td><td><button class="edit-btn" onclick="editProduct('${p.id}')">✏️</button><button class="delete-btn" onclick="deleteProduct('${p.id}')">🗑️</button></td></tr>`).join('')}</tbody></table>`;
}

function addProduct(){
    let id='prod_'+Date.now();
    let name=document.getElementById('name').value;
    let price=parseInt(document.getElementById('price').value);
    let size=document.getElementById('size').value;
    let age=document.getElementById('age').value;
    let category=document.getElementById('category').value;
    let imgUrl=document.getElementById('imgUrl').value||'https://placehold.co/400x400/bf40ff/white?text=NO';
    if(!name||!price){alert('Nomi va narxni kiriting!');return;}
    let newP={id,name,price,size,age,category,image_url:imgUrl,created_at:new Date().toISOString()};
    products.push(newP);
    localStorage.setItem('products',JSON.stringify(products));
    try{fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newP)});}catch(e){}
    alert('✅ Qo\'shildi!');
    document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('size').value='';document.getElementById('age').value='';document.getElementById('imgUrl').value='';
    displayProducts();
}

function editProduct(id){
    let p=products.find(p=>p.id===id);
    if(!p) return;
    let newName=prompt('Yangi nom:',p.name);
    let newPrice=prompt('Yangi narx:',p.price);
    if(newName&&newPrice){
        p.name=newName; p.price=parseInt(newPrice);
        localStorage.setItem('products',JSON.stringify(products));
        displayProducts();
        alert('✅ Yangilandi!');
    }
}

function deleteProduct(id){
    if(confirm('O\'chirilsinmi?')){
        products=products.filter(p=>p.id!==id);
        localStorage.setItem('products',JSON.stringify(products));
        displayProducts();
        alert('✅ O\'chirildi!');
    }
}

function logout(){window.location.href='/';}
loadData();
</script>
</body>
</html>
