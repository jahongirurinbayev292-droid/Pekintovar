<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #2e0249 0%, #570a57 100%); 
            color: #fff; min-height: 100vh;
        }

        header {
            background: rgba(0,0,0,0.8); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f806cc; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 18px; font-weight: 900; color: #f806cc; }
        .btn-top { cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; border: 1px solid #f806cc; }

        .cats { text-align: center; padding: 15px; overflow-x: auto; white-space: nowrap; }
        .cats button { 
            padding: 8px 16px; margin: 4px; border: 1px solid #f806cc; 
            background: transparent; color: #fff; cursor: pointer; border-radius: 20px; font-size: 12px;
        }
        .cats button.active { background: #f806cc; }

        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 8px; padding: 10px; max-width: 1000px; margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid rgba(248, 6, 204, 0.2);
            overflow: hidden; text-align: center; padding-bottom: 10px; cursor: pointer;
        }
        .card img { width: 100%; height: 110px; object-fit: cover; pointer-events: none; }
        .card h4 { margin: 6px 0 3px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
        .price { color: #00ffab; font-weight: bold; font-size: 13px; }

        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        .m-box {
            background: #2e0249; padding: 25px; border-radius: 20px; max-width: 340px; width: 90%;
            text-align: center; border: 2px solid #f806cc; position: relative;
        }
        .close { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
            .card img { height: 95px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR</div>
    <div class="nav-right">
        <div class="btn-top" onclick="authAdmin()">⚙️ Sozlamalar</div>
        <div class="btn-top" onclick="sendToTelegram()">🛒 Savat (<span id="c-count">0</span>)</div>
    </div>
</header>

<div class="cats">
    <button onclick="loadItems('Hammasi', this)" class="active">Barchasi</button>
    <button onclick="loadItems('Erkaklar', this)">Erkaklar</button>
    <button onclick="loadItems('Ayollar', this)">Ayollar</button>
    <button onclick="loadItems('Bolalar', this)">Bolalar</button>
</div>

<div class="grid" id="main_box"></div>

<div id="modal">
    <div class="m-box">
        <span class="close" onclick="closeM()">&times;</span>
        <img id="m-img" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:15px;">
        <h3 id="m-title" style="color:#f806cc; margin:0 0 10px 0;"></h3>
        <div id="m-price" style="font-size:20px; color:#00ffab; font-weight:bold; margin-bottom:15px;"></div>
        <div style="text-align: left; font-size: 13px; opacity: 0.9;">
            <p>📏 O'lcham: <span id="m-size"></span></p>
            <p>👶 Yosh: <span id="m-age"></span></p>
            <p>📝 Izoh: <span id="m-desc"></span></p>
        </div>
        <button onclick="addBasket()" style="width:100%; margin-top:15px; background:#f806cc; border:none; color:white; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">SAVATGA SOLISH</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let cart = [];
    let current = {};

    // 1. ADMIN SAHIFASIGA O'TISH
    function authAdmin() {
        let p = prompt("Maxfiy kod:");
        if(p === "4321") window.location.href = "admin.html";
        else if(p !== null) alert("Xato!");
    }

    // 2. MAHSULOTLARNI CHIQARISH
    function loadItems(category, btn) {
        const box = document.getElementById('main_box');
        document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        database.ref('products').on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            Object.keys(data).reverse().forEach(key => {
                let p = data[key];
                if(category === 'Hammasi' || p.category === category) {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openM(p.name, p.price, p.images[0], p.size, p.age, p.desc);
                    card.innerHTML = `<img src="${p.images[0]}"><h4>${p.name}</h4><div class="price">${parseInt(p.price).toLocaleString()} so'm</div>`;
                    box.appendChild(card);
                }
            });
        });
    }

    function openM(n, p, i, s, a, d) {
        current = {name: n, price: p, img: i};
        document.getElementById('m-title').innerText = n;
        document.getElementById('m-price').innerText = parseInt(p).toLocaleString() + " so'm";
        document.getElementById('m-img').src = i;
        document.getElementById('m-size').innerText = s || "-";
        document.getElementById('m-age').innerText = a || "-";
        document.getElementById('m-desc').innerText = d || "-";
        document.getElementById('modal').style.display = "flex";
    }
    function closeM() { document.getElementById('modal').style.display = "none"; }

    function addBasket() {
        cart.push(current);
        document.getElementById('c-count').innerText = cart.length;
        closeM();
    }

    // 3. ADMINGA RASM BILAN BUYURTMA YUBORISH
    function sendToTelegram() {
        if(cart.length === 0) return alert("Savat bo'sh!");
        
        // Telegramda rasm ko'rinishi uchun Markdown [ ](link) formatidan foydalanamiz
        // Muhim: Link matnning eng boshida bo'lishi kerak!
        let message = "";
        cart.forEach((v, i) => {
            message += `[\u00A0](${v.img})` + // Mana shu qator rasmni chiqaradi
                       `🛍 *${v.name}*\n` +
                       `💰 Narxi: ${v.price} so'm\n\n`;
        });

        const url = `https://t.me/Jahongir3616?text=${encodeURIComponent(message)}&parse_mode=MarkdownV2`;
        window.location.href = url;
    }

    loadItems('Hammasi');
</script>
</body>
</html>
