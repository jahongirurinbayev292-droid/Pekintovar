<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #0a0a2a, #1a0033);
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(191,64,255,0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .section {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            color: #bf40ff;
            margin-bottom: 15px;
        }
        input, select, button {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #bf40ff;
            color: white;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }
        .category-card {
            background: rgba(191,64,255,0.2);
            display: inline-block;
            padding: 5px 15px;
            margin: 5px;
            border-radius: 20px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #bf40ff;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid #bf40ff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👑 Admin Panel</h1>
        <button onclick="logout()">Chiqish</button>
    </div>
    
    <!-- Kategoriyalar -->
    <div class="section">
        <h2>📁 Kategoriyalar</h2>
        <div id="categoriesList"></div>
        <div style="margin-top: 15px;">
            <input type="text" id="newCategory" placeholder="Yangi kategoriya">
            <button onclick="addCategory()">➕ Qo'shish</button>
        </div>
    </div>
    
    <!-- Mahsulot qo'shish -->
    <div class="section">
        <h2>➕ Mahsulot qo'shish</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 15px;">
            <div class="form-group">
                <label>Rasm</label>
                <input type="file" id="productImage">
            </div>
            <div class="form-group">
                <label>Nomi</label>
                <input type="text" id="productName" placeholder="Mahsulot nomi">
            </div>
            <div class="form-group">
                <label>Narx (so'm)</label>
                <input type="number" id="productPrice" placeholder="380000">
            </div>
            <div class="form-group">
                <label>Razmer</label>
                <input type="text" id="productSize" placeholder="L, XL, 42">
            </div>
            <div class="form-group">
                <label>Yosh</label>
                <input type="text" id="productAge" placeholder="7-10 yosh">
            </div>
            <div class="form-group">
                <label>Kategoriya</label>
                <select id="productCategory"></select>
            </div>
        </div>
        <button onclick="addProduct()" style="margin-top: 15px; width: 100%;">✅ Mahsulot qo'shish</button>
    </div>
    
    <!-- Mahsulotlar -->
    <div class="section">
        <h2>📦 Mahsulotlar</h2>
        <div id="productsTable"></div>
    </div>
</div>

<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const storage = firebase.storage();

let categories = [];
let products = [];

// Kategoriyalar
async function loadCategories() {
    const snapshot = await database.ref('categories').once('value');
    const data = snapshot.val();
    categories = data && Array.isArray(data) ? data : ["Kiyimlar", "Oyoq kiyimlar", "Aksessuarlar"];
    
    document.getElementById('categoriesList').innerHTML = categories.map(cat => `
        <div class="category-card">
            ${cat}
            <button onclick="deleteCategory('${cat}')" style="background:#ff4040; margin-left:10px;">✖</button>
        </div>
    `).join('');
    
    const select = document.getElementById('productCategory');
    select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
}

async function addCategory() {
    const newCat = document.getElementById('newCategory').value;
    if (!newCat) return;
    categories.push(newCat);
    await database.ref('categories').set(categories);
    loadCategories();
    document.getElementById('newCategory').value = '';
}

async function deleteCategory(cat) {
    categories = categories.filter(c => c !== cat);
    await database.ref('categories').set(categories);
    loadCategories();
}

// Mahsulotlar
async function loadProducts() {
    const snapshot = await database.ref('products').once('value');
    const data = snapshot.val();
    products = data ? Object.values(data) : [];
    
    if (products.length === 0) {
        document.getElementById('productsTable').innerHTML = '<div>Mahsulot yo\'q</div>';
        return;
    }
    
    document.getElementById('productsTable').innerHTML = `
        <table>
            <tr><th>Rasm</th><th>Nomi</th><th>Narx</th><th>Razmer</th><th>Yosh</th><th>Kategoriya</th><th>Amallar</th></tr>
            ${products.map(p => `
                <tr>
                    <td><img class="product-img" src="${p.image_url}" onerror="this.src='https://placehold.co/50'"></td>
                    <td>${p.name}</td>
                    <td>${(p.price || 0).toLocaleString()} so'm</td>
                    <td>${p.size || '-'}</td>
                    <td>${p.age || '-'}</td>
                    <td>${p.category || 'Kiyimlar'}</td>
                    <td>
                        <button onclick="editProduct('${p.id}')">✏️</button>
                        <button onclick="deleteProduct('${p.id}')" style="background:#ff4040;">🗑️</button>
                    </td>
                </tr>
            `).join('')}
        </table>
    `;
}

async function addProduct() {
    const file = document.getElementById('productImage').files[0];
    if (!file) {
        alert('Rasm tanlang!');
        return;
    }
    
    const id = `prod_${Date.now()}`;
    
    // Rasm yuklash
    const storageRef = storage.ref(`products/${id}.jpg`);
    await storageRef.put(file);
    const url = await storageRef.getDownloadURL();
    
    // Ma'lumot
    const product = {
        id: id,
        name: document.getElementById('productName').value,
        price: parseInt(document.getElementById('productPrice').value),
        size: document.getElementById('productSize').value,
        age: document.getElementById('productAge').value,
        category: document.getElementById('productCategory').value,
        image_url: url,
        created_at: new Date().toISOString()
    };
    
    await database.ref(`products/${id}`).set(product);
    alert('✅ Qo\'shildi!');
    loadProducts();
    
    // Formani tozalash
    document.getElementById('productName').value = '';
    document.getElementById('productPrice').value = '';
    document.getElementById('productSize').value = '';
    document.getElementById('productAge').value = '';
    document.getElementById('productImage').value = '';
}

async function editProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    
    const newName = prompt('Yangi nom:', product.name);
    const newPrice = prompt('Yangi narx:', product.price);
    if (newName && newPrice) {
        await database.ref(`products/${id}`).update({
            name: newName,
            price: parseInt(newPrice)
        });
        loadProducts();
    }
}

async function deleteProduct(id) {
    if (confirm('O\'chirilsinmi?')) {
        await database.ref(`products/${id}`).remove();
        loadProducts();
    }
}

function logout() {
    window.location.href = 'index.html';
}

loadCategories();
loadProducts();
</script>
</body>
</html>
