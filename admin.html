<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Tavor 2026</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #2e0249 0%, #570a57 100%); 
            color: #fff; min-height: 100vh;
        }

        header {
            background: rgba(0,0,0,0.85); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f806cc; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 18px; font-weight: 900; color: #f806cc; }
        .btn-top { cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; border: 1px solid #f806cc; }

        .cats { text-align: center; padding: 15px; overflow-x: auto; white-space: nowrap; }
        .cats button { 
            padding: 8px 16px; margin: 4px; border: 1px solid #f806cc; 
            background: transparent; color: #fff; cursor: pointer; border-radius: 20px; font-size: 12px;
        }
        .cats button.active { background: #f806cc; }

        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 8px; padding: 10px; max-width: 1000px; margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid rgba(248, 6, 204, 0.2);
            overflow: hidden; text-align: center; padding-bottom: 10px; cursor: pointer;
        }
        .card img { width: 100%; height: 100px; object-fit: cover; }
        .card h4 { margin: 6px 0 3px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
        .price { color: #00ffab; font-weight: bold; font-size: 12px; }

        #modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        .m-box {
            background: #2e0249; padding: 25px; border-radius: 20px; max-width: 340px; width: 90%;
            text-align: center; border: 2px solid #f806cc; position: relative;
        }
        .close { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">PEKIN TAVOR</div>
    <div class="nav-right">
        <div class="btn-top" onclick="authAdmin()">⚙️ Sozlamalar</div>
        <div class="btn-top" onclick="sendOrder()">🛒 Yuborish (<span id="cart-ui">0</span>)</div>
    </div>
</header>

<div class="cats" id="cats-nav">
    <button onclick="renderAll('Hammasi', this)" class="active">Barchasi</button>
    <button onclick="renderAll('Erkaklar', this)">Erkaklar</button>
    <button onclick="renderAll('Ayollar', this)">Ayollar</button>
    <button onclick="renderAll('Bolalar', this)">Bolalar</button>
</div>

<div class="grid" id="main_box"></div>

<div id="modal">
    <div class="m-box">
        <span class="close" onclick="closeM()">&times;</span>
        <img id="m-img" style="width:100%; height:200px; object-fit:cover; border-radius:12px; margin-bottom:15px;">
        <h2 id="m-title" style="color:#f806cc; margin:0 0 10px 0;"></h2>
        <div id="m-price" style="font-size:22px; color:#00ffab; font-weight:bold; margin-bottom:15px;"></div>
        <div style="text-align: left; font-size: 14px;">
            <p>📏 O'lcham: <span id="m-size"></span></p>
            <p>👶 Yosh: <span id="m-age"></span></p>
            <p>📝 Izoh: <span id="m-desc"></span></p>
        </div>
        <button onclick="addBasket()" style="width:100%; margin-top:15px; background:#f806cc; border:none; color:white; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">SAVATGA SOLISH</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let basket = [];
    let selectedItem = {};

    // 1. ADMIN PANELGA O'TISH - TO'LIQ YO'L BILAN
    function authAdmin() {
        let p = prompt("Kod kirit:");
        if(p === "4321") {
            // GitHub Pages'da papka ichida bo'lsa, to'liq nomini yozish xavfsizroq
            window.location.href = "admin.html";
        } else if(p !== null) {
            alert("Xato!");
        }
    }

    function renderAll(cat, btn) {
        const box = document.getElementById('main_box');
        document.querySelectorAll('.cats button').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        db.ref('products').on('value', snap => {
            box.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            Object.keys(data).reverse().forEach(key => {
                let p = data[key];
                if(cat === 'Hammasi' || p.category === cat) {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => {
                        selectedItem = {name: p.name, price: p.price, img: p.images[0], size: p.size, age: p.age, desc: p.desc};
                        document.getElementById('m-title').innerText = p.name;
                        document.getElementById('m-price').innerText = parseInt(p.price).toLocaleString() + " so'm";
                        document.getElementById('m-img').src = p.images[0];
                        document.getElementById('m-size').innerText = p.size || "-";
                        document.getElementById('m-age').innerText = p.age || "-";
                        document.getElementById('m-desc').innerText = p.desc || "-";
                        document.getElementById('modal').style.display = "flex";
                    };
                    card.innerHTML = `<img src="${p.images[0]}"><h4>${p.name}</h4><div class="price">${parseInt(p.price).toLocaleString()} so'm</div>`;
                    box.appendChild(card);
                }
            });
        });
    }

    function closeM() { document.getElementById('modal').style.display = "none"; }

    function addBasket() {
        basket.push(selectedItem);
        document.getElementById('cart-ui').innerText = basket.length;
        closeM();
    }

    // 2. TELEGRAMGA MATN VA RASMNI TO'G'RI YUBORISH
    function sendOrder() {
        if(basket.length === 0) return alert("Savat bo'sh!");
        
        let message = "";
        basket.forEach((v, i) => {
            // Rasm havolasini matn boshiga Markdown formatida qo'yamiz.
            // Bu usulda Telegram linkni "Preview" qiladi.
            message += `[\u200B](${v.img})` + 
                       `🛍 *YANGI BUYURTMA #${i+1}*\n` +
                       `📦 *Nomi:* ${v.name}\n` +
                       `💰 *Narxi:* ${parseInt(v.price).toLocaleString()} so'm\n` +
                       `📏 *O'lcham:* ${v.size || "-"}\n` +
                       `👶 *Yosh:* ${v.age || "-"}\n` +
                       `📝 *Izoh:* ${v.desc || "-"}\n\n`;
        });

        // Markdown formatida yuborish
        const finalUrl = `https://t.me/Jahongir3616?text=${encodeURIComponent(message)}&parse_mode=Markdown`;
        window.location.href = finalUrl;
    }

    renderAll('Hammasi');
</script>
</body>
</html>
