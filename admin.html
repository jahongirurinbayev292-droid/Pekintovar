<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body { background:#0c0018; color:white; font-family:sans-serif; }
h1 { text-align:center; color:#b366ff; }
table { width:90%; margin:auto; border-collapse:collapse; margin-top:30px; }
td,th { border:1px solid #8000ff; padding:8px; text-align:center; }
button { background:#8000ff; border:none; color:white; padding:5px 10px; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>

<h1>⚙️ Admin Panel</h1>
<table id="tbl"><thead><tr><th>Rasm</th><th>Narx</th><th>Razmer</th><th>Yosh</th><th>Amal</th></tr></thead><tbody></tbody></table>

<script type="module">
import { initializeApp } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js)";
import { getDatabase, ref, get, remove } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js)";
import { firebaseConfig } from "./config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

async function loadAdmin() {
  const snap = await get(ref(db, "products"));
  if (!snap.exists()) return;
  const data = snap.val();
  const tbody = document.querySelector("#tbl tbody");
  for (let key in data) {
    const p = data[key];
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><img src="${p.image_url}" width="80"></td>
      <td>${p.price}</td>
      <td>${p.size || '-'}</td>
      <td>${p.age || '-'}</td>
      <td><button onclick="del('${key}')">O'chirish</button></td>`;
    tbody.appendChild(tr);
  }
}

window.del = async function(key) {
  await remove(ref(db, "products/" + key));
  location.reload();
};

loadAdmin();
</script>
</body>
</html>
