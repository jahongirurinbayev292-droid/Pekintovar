<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: 300px; }
        input, button { width: 100%; margin: 5px 0; padding: 10px; }
        #panel { display: none; }
    </style>
</head>
<body>
    <div id="login" class="box">
        <input type="password" id="pass" placeholder="Admin Parol">
        <button onclick="check()">Kirish</button>
    </div>

    <div id="panel" class="box">
        <h3>Mahsulot qo'shish</h3>
        <input type="text" id="n" placeholder="Nomi">
        <input type="text" id="p" placeholder="Narxi">
        <input type="file" id="f" multiple>
        <button onclick="add()">Saqlash</button>
        <p id="st"></p>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function check() {
            if(document.getElementById('pass').value === "7777") {
                document.getElementById('login').style.display='none';
                document.getElementById('panel').style.display='block';
            } else { alert("Xato!"); }
        }

        async function add() {
            const name = document.getElementById('n').value;
            const price = document.getElementById('p').value;
            const files = document.getElementById('f').files;
            if(!name || !price || files.length === 0) return;
            
            document.getElementById('st').innerText = "Yuklanmoqda...";
            const imgs = [];
            for(let file of files) {
                const b64 = await new Promise(r => {
                    const fr = new FileReader();
                    fr.onload = (e) => r(e.target.result);
                    fr.readAsDataURL(file);
                });
                imgs.push(b64);
            }
            await db.ref('products').push({name, price, images: imgs});
            alert("Saqlandi!");
            location.reload();
        }
    </script>
</body>
</html>
