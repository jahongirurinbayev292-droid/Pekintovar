<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | PEKIN TOVAR</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:linear-gradient(135deg,#0a0a2a,#1a0033);color:#fff;padding:20px}
        .header{background:rgba(191,64,255,0.2);padding:15px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-between}
        .section{background:rgba(255,255,255,0.1);border-radius:10px;padding:15px;margin-bottom:20px}
        h2{color:#bf40ff;margin-bottom:15px}
        input,select,button{padding:8px;margin:5px;border-radius:5px;border:none}
        button{background:#bf40ff;color:#fff;cursor:pointer}
        table{width:100%;border-collapse:collapse}
        th,td{padding:10px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.2)}
        .product-img{width:50px;height:50px;object-fit:cover;border-radius:5px}
        .form-group{margin-bottom:10px}
        .form-group label{display:block;margin-bottom:5px;color:#bf40ff}
        .form-group input,.form-group select{width:100%;background:rgba(0,0,0,0.5);color:#fff;border:1px solid #bf40ff}
        .loading{text-align:center;padding:40px;color:#bf40ff}
        .category-card{background:rgba(191,64,255,0.2);display:inline-block;padding:5px 15px;margin:5px;border-radius:20px}
    </style>
</head>
<body>
<div class="header"><h1>👑 Admin Panel</h1><button onclick="logout()">Chiqish</button></div>

<div class="section">
    <h2>📁 Kategoriyalar</h2>
    <div id="categoriesList"></div>
    <div><input type="text" id="newCat" placeholder="Yangi kategoriya"><button onclick="addCategory()">➕ Qo'shish</button></div>
</div>

<div class="section">
    <h2>➕ Mahsulot qo'shish</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
        <div class="form-group"><label>Rasm URL</label><input type="text" id="imgUrl" placeholder="https://..."></div>
        <div class="form-group"><label>Nomi</label><input type="text" id="name"></div>
        <div class="form-group"><label>Narx (so'm)</label><input type="number" id="price"></div>
        <div class="form-group"><label>Razmer</label><input type="text" id="size"></div>
        <div class="form-group"><label>Yosh</label><input type="text" id="age"></div>
        <div class="form-group"><label>Kategoriya</label><select id="category"></select></div>
    </div>
    <button onclick="addProduct()" style="margin-top:10px;width:100%">✅ Qo'shish</button>
</div>

<div class="section">
    <h2>📦 Mahsulotlar</h2>
    <div id="productsTable"><div class="loading">⏳ Yuklanmoqda...</div></div>
</div>

<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let categories = ["Kiyimlar","Oyoq kiyimlar","Aksessuarlar"];

async function loadCategories(){
    db.ref('categories').on('value', (snap) => {
        let data = snap.val();
        if(data && Array.isArray(data)) categories = data;
        else if(data && typeof data === 'object') categories = Object.values(data);
        document.getElementById('categoriesList').innerHTML = categories.map(c => `<div class="category-card">${c} <button onclick="delCategory('${c}')" style="background:#ff4040;margin-left:10px">✖</button></div>`).join('');
        document.getElementById('category').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    });
}

async function addCategory(){
    let newCat = document.getElementById('newCat').value;
    if(!newCat) return;
    categories.push(newCat);
    await db.ref('categories').set(categories);
    document.getElementById('newCat').value = '';
}

async function delCategory(cat){
    categories = categories.filter(c => c !== cat);
    await db.ref('categories').set(categories);
}

async function loadProducts(){
    db.ref('products').on('value', (snap) => {
        let data = snap.val();
        let products = data ? Object.values(data) : [];
        if(products.length === 0){
            document.getElementById('productsTable').innerHTML = '<div class="loading">📭 Mahsulot yo\'q</div>';
            return;
        }
        document.getElementById('productsTable').innerHTML = `
            <table><thead><tr><th>Rasm</th><th>Nomi</th><th>Narx</th><th>Razmer</th><th>Yosh</th><th>Kategoriya</th><th>Amallar</th></tr></thead>
            <tbody>${products.map(p => `
                <tr>
                    <td><img class="product-img" src="${p.image_url}" onerror="this.src='https://placehold.co/50/bf40ff/white?text=?'"></td>
                    <td>${p.name}</td>
                    <td>${(p.price||0).toLocaleString()} so'm</td>
                    <td>${p.size||'-'}</td>
                    <td>${p.age||'-'}</td>
                    <td>${p.category||'-'}</td>
                    <td><button onclick="editProduct('${p.id}')">✏️</button> <button onclick="delProduct('${p.id}')" style="background:#ff4040">🗑️</button></td>
                </tr>
            `).join('')}</tbody></table>
        `;
    });
}

async function addProduct(){
    let id = `prod_${Date.now()}`;
    let product = {
        id: id,
        name: document.getElementById('name').value,
        price: parseInt(document.getElementById('price').value),
        size: document.getElementById('size').value,
        age: document.getElementById('age').value,
        category: document.getElementById('category').value,
        image_url: document.getElementById('imgUrl').value || 'https://placehold.co/400x400/bf40ff/white?text=NO+IMAGE',
        created_at: new Date().toISOString()
    };
    if(!product.name || !product.price){
        alert('Nomi va narxni kiriting!');
        return;
    }
    await db.ref(`products/${id}`).set(product);
    alert('✅ Qo\'shildi!');
    document.getElementById('name').value = '';
    document.getElementById('price').value = '';
    document.getElementById('size').value = '';
    document.getElementById('age').value = '';
    document.getElementById('imgUrl').value = '';
}

async function editProduct(id){
    let snap = await db.ref(`products/${id}`).once('value');
    let p = snap.val();
    if(!p) return;
    let newName = prompt('Yangi nom:', p.name);
    let newPrice = prompt('Yangi narx:', p.price);
    if(newName && newPrice){
        await db.ref(`products/${id}`).update({name: newName, price: parseInt(newPrice)});
        alert('✅ Yangilandi!');
    }
}

async function delProduct(id){
    if(confirm('O\'chirilsinmi?')){
        await db.ref(`products/${id}`).remove();
        alert('✅ O\'chirildi!');
    }
}

function logout(){
    window.location.href = '/';
}

loadCategories();
loadProducts();
</script>
</body>
</html>
