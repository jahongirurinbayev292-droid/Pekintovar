<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekin Admin | Professional Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #f806cc; --bg: #1a1a2e; --card: #16213e; --text: #ffffff; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: var(--text); padding-bottom: 50px;
        }
        header {
            background: rgba(0,0,0,0.8); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000;
        }
        .btn-back { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 14px; }
        
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid rgba(248, 6, 204, 0.2); margin-bottom: 20px; }
        
        h2 { color: var(--primary); margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        input, select, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #0f3460; border: 1px solid #f806cc;
            color: white; border-radius: 8px; outline: none;
        }
        
        .btn-add {
            width: 100%; background: #00ffab; color: #000; border: none;
            padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;
        }

        .prod-list { margin-top: 30px; }
        .prod-item {
            display: flex; align-items: center; background: rgba(255,255,255,0.05);
            padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--primary);
        }
        .prod-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 15px; }
        .prod-info { flex: 1; }
        .prod-info b { display: block; font-size: 14px; }
        .prod-info span { font-size: 12px; color: #aaa; }
        .btn-del { background: #ff4757; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: 900; color: var(--primary);">ADMIN PANEL</div>
    <a href="index.html" class="btn-back"><i class="fas fa-home"></i> Bosh sahifa</a>
</header>

<div class="container">
    <div class="card">
        <h2><i class="fas fa-plus-circle"></i> Yangi mahsulot</h2>
        <input type="text" id="p-name" placeholder="Mahsulot nomi...">
        <input type="number" id="p-price" placeholder="Narxi (faqat son)...">
        
        <select id="p-cat">
            <option value="Erkaklar">Erkaklar bo'limi</option>
            <option value="Ayollar">Ayollar bo'limi</option>
            <option value="Bolalar">Bolalar bo'limi</option>
        </select>
        
        <input type="text" id="p-size" placeholder="O'lchamlar (masalan: 38-42)">
        <input type="text" id="p-age" placeholder="Yosh (bolalar uchun)">
        <input type="text" id="p-img" placeholder="Rasm linki (Telegramdan olingan)">
        <textarea id="p-desc" rows="3" placeholder="Mahsulot haqida qo'shimcha ma'lumot..."></textarea>
        
        <button class="btn-add" onclick="saveToFirebase()"><i class="fas fa-save"></i> BAZAGA QO'SHISH</button>
    </div>

    <div class="prod-list">
        <h2><i class="fas fa-boxes"></i> Mavjud mahsulotlar</h2>
        <div id="list-container"></div>
    </div>
</div>

<script>
    // Firebase sozlamalari
    const firebaseConfig = { databaseURL: "https://pekin-tavor-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. MAHSULOTNI SAQLASH
    function saveToFirebase() {
        const name = document.getElementById('p-name').value;
        const price = document.getElementById('p-price').value;
        const cat = document.getElementById('p-cat').value;
        const img = document.getElementById('p-img').value;
        const size = document.getElementById('p-size').value;
        const age = document.getElementById('p-age').value;
        const desc = document.getElementById('p-desc').value;

        if(!name || !price || !img) return alert("Nom, narx va rasm shart!");

        const newProd = {
            name: name,
            price: price,
            category: cat,
            images: [img], // Savatga rasm bo'lib borishi uchun array ko'rinishida
            size: size || "-",
            age: age || "-",
            desc: desc || "-",
            time: Date.now()
        };

        db.ref('products').push(newProd)
        .then(() => {
            alert("Mahsulot qo'shildi!");
            // Formani tozalash
            document.getElementById('p-name').value = "";
            document.getElementById('p-price').value = "";
            document.getElementById('p-img').value = "";
        })
        .catch(err => alert("Xato: " + err));
    }

    // 2. MAHSULOTLARNI KO'RSATISH VA O'CHIRISH
    function loadProducts() {
        db.ref('products').on('value', snap => {
            const container = document.getElementById('list-container');
            container.innerHTML = "";
            const data = snap.val();
            
            if(!data) {
                container.innerHTML = "<p>Mahsulotlar yo'q.</p>";
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const p = data[key];
                const item = document.createElement('div');
                item.className = 'prod-item';
                item.innerHTML = `
                    <img src="${p.images[0]}">
                    <div class="prod-info">
                        <b>${p.name}</b>
                        <span>${p.category} | ${parseInt(p.price).toLocaleString()} so'm</span>
                    </div>
                    <button class="btn-del" onclick="deleteProd('${key}')"><i class="fas fa-trash"></i></button>
                `;
                container.appendChild(item);
            });
        });
    }

    function deleteProd(key) {
        if(confirm("Ushbu mahsulotni o'chirmoqchimisiz?")) {
            db.ref('products/' + key).remove();
        }
    }

    // Sahifa yuklanganda ro'yxatni chiqarish
    loadProducts();
</script>

</body>
</html>
